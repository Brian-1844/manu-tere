/* ---------- crafts: pāreu, tāupoʻo, hei poe, tapa ---------- */
const DYES={rea:{c:'#E2A12A',en:'yellow'},aute:{c:'#8E4FB0',en:'violet'},mati:{c:'#A8432C',en:'red-brown'},tiairi:{c:'#2A2A2E',en:'black'}};
const CRAFTS={
  pareu:{r:'Pāreu', en:'Sun-printed pāreu', need:{vavai:2}, any:['rea','aute','mati'], txt:'2 vavai and 1 dye (rēʻa, ʻaute or mati)',
    fact:'A pāreu is one length of cloth, tied in dozens of ways. Some painters make sun prints: leaves laid on wet, freshly painted cloth leave a pale shape once the sun has dried it.',
    real:'Look for hand-painted pāreu at Papeete market and in craft shops on every island.'},
  hat:{r:'Tāupoʻo', en:'Woven hat', need:{fara:3}, txt:'3 fara (pandanus)',
    fact:'Hats are woven from pandanus leaves (fara, paeʻore), coconut leaflets (nīʻau) and other fibres, strip over strip. The Austral Islands are famous for their weaving, and each island has its own patterns.',
    real:'Woven hats are sold at Papeete market and at craft fairs. Buying from the weaver supports the craft.'},
  hei:{r:'Hei poe', en:'Pearl and shell necklace', txt:'1 pearl and 3 pūpū', ok:()=>G().pearls.length>=1 && (G().bag.pupu||0)>=3,
    fact:'A hei is a garland for the head or neck, made of flowers or shells. A shell necklace is often given to visitors when they leave, as a sign of protection. Tahitian pearls grow in the black-lipped oyster; their dark greens, blues and greys are natural.',
    real:'Pearl farms in the lagoons of the Tuamotu and Gambier islands welcome visitors.'},
  tapa:{r:'Tapa', en:'Beaten bark cloth', need:{bark:2}, any:['tiairi','mati','rea'], txt:'2 ʻuru bark and 1 dye (tiʻaʻiri, mati or rēʻa)',
    fact:'Tapa is cloth made of beaten bark: ʻuru, banyan (ʻōrā) or paper mulberry. Women beat it with a grooved beater, the ʻiʻe, on a wooden anvil until it is four or five times wider. Plants give the colours: rēʻa for yellow, mati and tou for red-brown, tiʻaʻiri for black.',
    real:'On Fatu Hiva, in the Marquesas, tapa is still made by hand.'}
};
function craftOK(id){ const C=CRAFTS[id]; if(C.ok) return C.ok(); return has(C.need) && (!C.any || C.any.some(k=>(G().bag[k]||0)>0)); }
function craftTile(id){ const C=CRAFTS[id], ok=craftOK(id), made=S.crafts&&S.crafts[id]; return `<button class="ctile" data-craft="${id}" ${ok?'':'disabled'}><span class="cth">${craftThumb(id,!made)}</span><b class="reo">${C.r}</b><span>${C.en}</span><span class="small muted">${ok?'Ready to make':'Needs '+C.txt}${made?' · made':''}</span></button>`; }
function openCraft(id){ const C=CRAFTS[id]; ac();
  openFull(`<div class="fhead"><div><div class="eyebrow">Make by hand · ${C.en}</div><h2 class="reo">${C.r}</h2></div>${XBTN}</div><div class="fbody" id="cb"></div>`,'',()=>openGarden());
  ({pareu:craftPareu,hat:craftHat,hei:craftHei,tapa:craftTapa})[id]($('#cb')); }
function finishCraft(id,extra){ const C=CRAFTS[id]; clearRun(); sfx('stamp'); learn(({pareu:['pareu'],hat:['taupoo','fara'],hei:['hei','poe','pupu'],tapa:['tapa','ie','ora']})[id],true); save();
  const cb=$('#cb'); cb.scrollTop=0; const r=document.createElement('div'); r.className='result';
  r.innerHTML=`<div class="eyebrow" style="text-align:center;margin-top:8px">Made by hand</div><h2 style="text-align:center"><span class="reo">${C.r}</span> · ${C.en}</h2>
    <div class="cbig">${craftThumb(id)}</div>${extra?`<p style="text-align:center">${extra}</p>`:''}
    ${id!=='tapa'?`<div class="card" style="align-items:center;text-align:center"><div class="birdbox">${birdSVG(S,'cr')}</div><p class="small">Your manu is wearing it. Change what it wears in <b>My manu</b>.</p></div>`:'<p class="small muted" style="text-align:center">Your tapa hangs in your Passport.</p>'}
    <div class="card flat"><div class="eyebrow">Did you know?</div><p class="small">${C.fact}</p></div>
    <div class="card flat"><div class="eyebrow">See it for real</div><p class="small">${C.real}</p></div>
    <div class="row"><button class="btn primary" id="crBack" style="flex:1">Back to the garden</button><button class="btn ghost" id="crShow">Show my manu</button></div>`;
  cb.appendChild(r); renderBird(); $('#crBack').onclick=()=>closeFull(); $('#crShow').onclick=()=>{ FULL_ON_CLOSE=null; closeFull(); later(()=>bubble(W.mauruuru.r,'Do you like it?'),400); }; }

/* shapes */
const URU_LEAF='M0 24 C-4 16 -16 14 -18 6 C-12 6 -10 2 -14 -4 C-8 -4 -6 -8 -10 -14 C-4 -12 -2 -16 0 -24 C2 -16 4 -12 10 -14 C6 -8 8 -4 14 -4 C10 2 12 6 18 6 C16 14 4 16 0 24Z';
function leafG(k,fill){ if(k==='uru') return `<path d="${URU_LEAF}" fill="${fill}"/>`;
  if(k==='fern'){ let s=`<rect x="-1" y="-24" width="2" height="48" fill="${fill}"/>`; for(let i=0;i<9;i++){ const y=-20+i*5, w=9-Math.abs(i-4)*1.1; s+=`<ellipse cx="${(-w/2-1).toFixed(1)}" cy="${y}" rx="${(w/2+1).toFixed(1)}" ry="2.2" transform="rotate(-18 ${(-w/2-1).toFixed(1)} ${y})" fill="${fill}"/><ellipse cx="${(w/2+1).toFixed(1)}" cy="${y}" rx="${(w/2+1).toFixed(1)}" ry="2.2" transform="rotate(18 ${(w/2+1).toFixed(1)} ${y})" fill="${fill}"/>`; } return s; }
  if(k==='niho') return `<path d="M-20 8 L-15 -8 L-10 8Z M-10 8 L-5 -8 L0 8Z M0 8 L5 -8 L10 8Z M10 8 L15 -8 L20 8Z" fill="${fill}"/>`;
  if(k==='honu') return `<ellipse cx="0" cy="0" rx="10" ry="13" fill="${fill}"/><circle cx="0" cy="-16" r="4" fill="${fill}"/><ellipse cx="-11" cy="-7" rx="6" ry="3" transform="rotate(-30 -11 -7)" fill="${fill}"/><ellipse cx="11" cy="-7" rx="6" ry="3" transform="rotate(30 11 -7)" fill="${fill}"/><ellipse cx="-9" cy="10" rx="5" ry="2.5" transform="rotate(30 -9 10)" fill="${fill}"/><ellipse cx="9" cy="10" rx="5" ry="2.5" transform="rotate(-30 9 10)" fill="${fill}"/>`;
  if(k==='wave') return `<path d="M-20 -8 q5 -5 10 0 t10 0 t10 0 t10 0 M-20 0 q5 -5 10 0 t10 0 t10 0 t10 0 M-20 8 q5 -5 10 0 t10 0 t10 0 t10 0" fill="none" stroke="${fill}" stroke-width="2.4" stroke-linecap="round"/>`;
  return [0,60,120,180,240,300].map(a=>`<ellipse cx="0" cy="-9" rx="5" ry="10" transform="rotate(${a+15})" fill="${fill}"/>`).join('')+`<circle r="4" fill="${fill}"/>`; }
const LEAFN={uru:'ʻuru leaf',fern:'fern',tiare:'tiare'};
const MOTIFN={fern:'fern print',niho:'niho (teeth)',honu:'honu (turtle)',wave:'waves'};
function svgPoint(svg,e,w,h){ const r=svg.getBoundingClientRect(); return [(e.clientX-r.left)/r.width*w,(e.clientY-r.top)/r.height*h]; }
function hatSVG(c,band){ const bc=band==='aute'?'#E0303A':band==='tiare'?'#FFFDF5':'#C8402F'; const fl=band==='tiare'?`<g transform="translate(73 27.5)">${[0,72,144,216,288].map(a=>`<circle cx="${(3*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(3*Math.sin(a*Math.PI/180)).toFixed(1)}" r="2.4" fill="#FFFDF5" stroke="#E2D6B8" stroke-width=".4"/>`).join('')}<circle r="1.4" fill="#F2C94C"/></g>`:band==='aute'?`<g transform="translate(73 27.5)">${[0,72,144,216,288].map(a=>`<circle cx="${(3*Math.cos(a*Math.PI/180)).toFixed(1)}" cy="${(3*Math.sin(a*Math.PI/180)).toFixed(1)}" r="2.6" fill="#E0303A"/>`).join('')}<circle r="1.3" fill="#8E1420"/></g>`:'';
  return `<g><ellipse cx="82" cy="31" rx="24" ry="5.5" fill="#E2C27A" stroke="#B8934A" stroke-width="1"/><path d="M68 31 Q70 13 82 13 Q94 13 96 31 Z" fill="#EBD08E" stroke="#B8934A" stroke-width="1"/><path d="M69 27 Q82 31.5 95 27" fill="none" stroke="${bc}" stroke-width="3"/><path d="M73 17 L91 17 M71 22 L93 22 M76 14 L78 30 M82 13 L82 30 M88 14 L86 30" stroke="#B8934A" stroke-width=".6" fill="none"/>${fl}</g>`; }
function neckSVG(beads){ const n=beads.length; return beads.map((b,i)=>{ const t=i/(n-1||1), x=60+t*32, y=60+Math.sin(t*Math.PI)*6.5+t*2; return b.t==='p'?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="2.5" fill="${b.c}" stroke="#C9D6D2" stroke-width=".5"/><circle cx="${(x-.7).toFixed(1)}" cy="${(y-.8).toFixed(1)}" r=".8" fill="#fff" opacity=".75"/>`:`<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="2" ry="2.6" fill="#F7E3D0" stroke="#C99A7A" stroke-width=".6"/>`; }).join(''); }
function craftThumb(id,ghost){ const cr=(S.crafts||{})[id];
  if(id==='pareu'){ const c=cr?cr.c:'#9DB4BC'; return `<svg viewBox="0 0 120 80" aria-hidden="true"><rect x="6" y="6" width="108" height="68" rx="3" fill="${ghost?'none':c}" stroke="${ghost?'#9DB4BC':shade(c,.7)}" stroke-width="2" ${ghost?'stroke-dasharray="4 4"':''}/>${cr&&!ghost?cr.m.map(m=>`<g transform="translate(${(m.x*.36+6).toFixed(1)} ${(m.y*.34+6).toFixed(1)}) rotate(${m.r}) scale(.45)">${leafG(m.k,'rgba(255,255,255,.55)')}</g>`).join(''):''}</svg>`; }
  if(id==='hat'){ return `<svg viewBox="62 6 40 30" aria-hidden="true" ${ghost?'opacity=".35"':''}>${hatSVG(null,cr?cr.band:'plain')}</svg>`; }
  if(id==='hei'){ const beads=cr&&!ghost?cr.beads:[{t:'s'},{t:'p',c:'#2B3036'},{t:'s'},{t:'p',c:'#3E5B57'},{t:'s'}]; return `<svg viewBox="55 54 42 20" aria-hidden="true" ${ghost?'opacity=".35"':''}><path d="M58 59 Q76 74 94 61" fill="none" stroke="#8A6A4A" stroke-width=".6"/>${neckSVG(beads)}</svg>`; }
  const c=cr?cr.c:'#8A6A4A'; return `<svg viewBox="0 0 120 80" aria-hidden="true"><rect x="8" y="6" width="104" height="68" rx="2" fill="${ghost?'none':'#E8D6B0'}" stroke="${ghost?'#9DB4BC':'#C9B48A'}" stroke-width="2" ${ghost?'stroke-dasharray="4 4"':''}/>${cr&&!ghost?cr.st.map(m=>`<g transform="translate(${(m.x*.4+8).toFixed(1)} ${(m.y*.4+6).toFixed(1)}) scale(.45)">${leafG(m.k,m.c||c)}</g>`).join(''):''}</svg>`; }

/* --- pāreu: sun print --- */
function craftPareu(el){ const g=G(); const dyes=CRAFTS.pareu.any.filter(k=>(g.bag[k]||0)>0); let dye=dyes[0], leaf='uru'; const marks=[]; let printed=false;
  el.innerHTML=`<div class="card"><b class="small">1. Choose a dye</b><div class="row" id="pDyes">${dyes.map(k=>`<button class="btn sm ${k===dye?'primary':'ghost'}" data-d="${k}"><span class="dot" style="background:${DYES[k].c}"></span>${BAGN[k]} · ${DYES[k].en}</button>`).join('')}</div></div>
    <div class="art" style="background:#F4E7CF"><svg viewBox="0 0 300 200" id="pSvg" role="img" aria-label="A length of cotton cloth, freshly dyed"><rect x="0" y="0" width="300" height="200" fill="#F4E7CF"/><rect id="pCloth" x="14" y="14" width="272" height="172" rx="3" fill="${DYES[dye].c}" style="transition:fill 1.2s"/>${Array.from({length:12},(_,i)=>`<path d="M${14+i*24} 186 v8 M${22+i*24} 14 v-8" stroke="${shade(DYES[dye].c,.8)}" stroke-width="2" class="fringe"/>`).join('')}<g id="pMarks" style="opacity:0;transition:opacity 1s"></g><g id="pLeaves" style="transition:opacity 1s"></g><rect id="pSun" width="300" height="200" fill="#FFF3C4" style="opacity:0;transition:opacity .9s"/></svg></div>
    <div class="card"><b class="small">2. Lay leaves on the wet cloth</b><div class="row" id="pLeafs">${Object.keys(LEAFN).map(k=>`<button class="btn sm ${k===leaf?'primary':'ghost'}" data-l="${k}">${LEAFN[k]}</button>`).join('')}</div><p class="small muted" id="pN">Tap the cloth to lay a leaf (0 of 8).</p></div>
    <button class="btn sun" id="pGo" disabled>3. Let the sun print it</button>`;
  const svg=$('#pSvg');
  const setDye=k=>{ dye=k; $('#pCloth').setAttribute('fill',DYES[k].c); $$('#pSvg .fringe').forEach(f=>f.setAttribute('stroke',shade(DYES[k].c,.8))); $$('#pDyes .btn').forEach(b=>b.className='btn sm '+(b.dataset.d===k?'primary':'ghost')); };
  $$('#pDyes .btn').forEach(b=>b.onclick=()=>{ if(!printed) setDye(b.dataset.d); });
  $$('#pLeafs .btn').forEach(b=>b.onclick=()=>{ leaf=b.dataset.l; $$('#pLeafs .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); });
  svg.addEventListener('pointerdown',e=>{ if(printed||marks.length>=8) return; const [x,y]=svgPoint(svg,e,300,200); if(x<28||x>272||y<28||y>172) return; const m={k:leaf,x:Math.round(x),y:Math.round(y),r:Math.round(rnd(-40,40))}; marks.push(m); sfx('tap');
    const tr=`translate(${m.x} ${m.y}) rotate(${m.r}) scale(1.3)`; $('#pMarks').insertAdjacentHTML('beforeend',`<g transform="${tr}">${leafG(m.k,'rgba(255,255,255,.58)')}</g>`); $('#pLeaves').insertAdjacentHTML('beforeend',`<g transform="${tr}">${leafG(m.k,m.k==='tiare'?'#FFFDF5':m.k==='fern'?'#2F7D4C':'#3B8C58')}</g>`);
    $('#pN').textContent=`Tap the cloth to lay a leaf (${marks.length} of 8).`; $('#pGo').disabled=marks.length<2; });
  $('#pGo').onclick=()=>{ if(printed) return; printed=true; $('#pGo').disabled=true; $('#pGo').textContent='The sun is printing…'; sfx('uke'); $('#pSun').style.opacity='.55';
    later(()=>{ $('#pSun').style.opacity='0'; $('#pCloth').setAttribute('fill',shade(DYES[dye].c,.88)); },1000);
    later(()=>{ $('#pLeaves').style.opacity='0'; $('#pMarks').style.opacity='1'; },1900);
    later(()=>{ take(Object.assign({vavai:2},{[dye]:1})); S.crafts=S.crafts||{}; S.crafts.pareu={c:shade(DYES[dye].c,.88),m:marks}; S.acc.pareu=true; save(); finishCraft('pareu',`Dyed with <span class="reo">${BAGN[dye]}</span>, printed by the sun.`); },3300); }; }

/* --- tāupoʻo: weave over and under --- */
const WEAVE={plain:{n:'Plain',rows:['OUOUOU','UOUOUO','OUOUOU','UOUOUO']}, twill:{n:'Twill',rows:['OOUUOO','UOOUUO','UUOOUU','OUUOOU']}, diamond:{n:'Diamond',rows:['UUOOUU','UOUUOU','OUUUUO','UOUUOU']}};
function craftHat(el){ let pat=null, i=0;
  el.innerHTML=`<div class="card"><b class="small">1. Choose a weave</b><div class="row" id="hPats">${Object.keys(WEAVE).map(k=>`<button class="btn sm ghost" data-w="${k}">${WEAVE[k].n}</button>`).join('')}</div><p class="small muted">Each fara strip goes over (O) or under (U) the strip it crosses.</p></div>
    <div class="art" style="background:#F2E6CC"><svg viewBox="0 0 240 160" id="hSvg" role="img" aria-label="A pandanus mat being woven"><rect width="240" height="160" fill="#F2E6CC"/><g id="hCells"></g><rect id="hCur" x="12" y="12" width="36" height="34" fill="none" stroke="#D9562E" stroke-width="3" rx="3" opacity="0"/></svg></div>
    <div class="card"><div class="row" style="justify-content:space-between"><span class="fb" id="hFb" aria-live="polite">Choose a weave to start.</span><b id="hN">0 / 24</b></div><div class="row" id="hRow" style="gap:4px;font-family:var(--display);font-weight:600"></div></div>
    <div class="pad"><button class="btn primary" id="hO" disabled>Over</button><button class="btn primary" id="hU" disabled>Under</button></div><div id="hBand"></div>`;
  const cell=(r,c,v)=>{ const x=12+c*36, y=12+r*34; return v==='O'?`<rect x="${x}" y="${y}" width="36" height="34" fill="#EBD08E" stroke="#B8934A" stroke-width=".8"/><path d="M${x} ${y+11} h36 M${x} ${y+23} h36" stroke="#C9A35E" stroke-width=".8"/>`:`<rect x="${x}" y="${y}" width="36" height="34" fill="#C9A35E" stroke="#9A7A44" stroke-width=".8"/><path d="M${x+12} ${y} v34 M${x+24} ${y} v34" stroke="#A8864A" stroke-width=".8"/>`; };
  const showRow=()=>{ if(!pat) return; const r=Math.floor(i/6); $('#hRow').innerHTML=r<4?`<span class="small muted" style="font-family:var(--body);font-weight:400">Row ${r+1}:</span>`+WEAVE[pat].rows[r].split('').map((v,c)=>`<span class="wv ${r*6+c<i?'done':''} ${r*6+c===i?'cur':''}">${v}</span>`).join(''):''; const cur=$('#hCur'); if(i<24){ cur.setAttribute('x',12+(i%6)*36); cur.setAttribute('y',12+r*34); cur.setAttribute('opacity','1'); } else cur.setAttribute('opacity','0'); };
  $$('#hPats .btn').forEach(b=>b.onclick=()=>{ if(i>0) return; pat=b.dataset.w; $$('#hPats .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); $('#hO').disabled=false; $('#hU').disabled=false; $('#hFb').textContent='Follow the row: over or under?'; showRow(); });
  const press=v=>{ if(!pat||i>=24) return; const r=Math.floor(i/6), c=i%6, want=WEAVE[pat].rows[r][c];
    if(v===want){ $('#hCells').insertAdjacentHTML('beforeend',cell(r,c,v)); i++; sfx('tap'); $('#hN').textContent=`${i} / 24`; $('#hFb').className='fb good'; $('#hFb').textContent=i%6?'Good':'Row done!'; showRow(); if(i>=24) bandStep(); }
    else { sfx('bad'); $('#hFb').className='fb bad'; $('#hFb').textContent=`This strip goes ${want==='O'?'over':'under'}.`; const b=$(v==='O'?'#hO':'#hU'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } };
  $('#hO').onclick=()=>press('O'); $('#hU').onclick=()=>press('U');
  const bandStep=()=>{ $('#hO').disabled=true; $('#hU').disabled=true; const g=G(); const opts=[['plain','Red band',true],['tiare','Tiare band',(g.bag.tiare||0)>0],['aute','ʻAute band',(g.bag.aute||0)>0]];
    $('#hBand').innerHTML=`<div class="card"><b class="small">Last step: a band for your tāupoʻo</b><div class="row">${opts.map(o=>`<button class="btn sm ghost" data-b="${o[0]}" ${o[2]?'':'disabled'}>${o[1]}${o[0]!=='plain'?` (${o[2]?'uses 1':'none in basket'})`:''}</button>`).join('')}</div></div>`;
    $('#hBand').scrollIntoView({behavior:RM?'auto':'smooth',block:'nearest'});
    $$('#hBand .btn').forEach(b=>b.onclick=()=>{ const band=b.dataset.b; const use={fara:3}; if(band!=='plain') use[band]=1; take(use); S.crafts=S.crafts||{}; S.crafts.hat={band,pat}; S.acc.hat=true; S.acc.hei=false; save(); finishCraft('hat',`A ${WEAVE[pat].n.toLowerCase()} weave of fara, with a ${band==='plain'?'red':BAGN[band]} band.`); }); }; }

/* --- hei poe: string pearls and shells --- */
function craftHei(el){ const g=G(); const beads=[]; const used=new Set(); const N=7;
  const slots=Array.from({length:N},(_,i)=>{ const t=(i+1)/(N+1); const x=(1-t)*(1-t)*20+2*(1-t)*t*150+t*t*280, y=(1-t)*(1-t)*24+2*(1-t)*t*134+t*t*24; return [x,y]; });
  el.innerHTML=`<div class="art" style="background:#123A55"><svg viewBox="0 0 300 120" role="img" aria-label="A cord for the necklace"><rect width="300" height="120" fill="#123A55"/><path d="M20 24 Q150 134 280 24" fill="none" stroke="#C9A35E" stroke-width="2"/><g id="kB">${slots.map(s=>`<circle cx="${s[0].toFixed(1)}" cy="${s[1].toFixed(1)}" r="10" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-dasharray="3 3"/>`).join('')}</g></svg></div>
    <div class="card"><b class="small">Tap a pearl or a shell to thread it (7 in all, at least one pearl)</b><div class="row" id="kPal"></div><div class="row"><button class="btn sm ghost" id="kUndo">Undo</button><span class="small muted" id="kN">0 / 7</span></div></div>
    <button class="btn sun" id="kGo" disabled>Tie the hei</button>`;
  const draw=()=>{ $('#kB').innerHTML=slots.map((s,i)=>{ const b=beads[i]; if(!b) return `<circle cx="${s[0].toFixed(1)}" cy="${s[1].toFixed(1)}" r="10" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-dasharray="3 3"/>`; return b.t==='p'?`<circle cx="${s[0].toFixed(1)}" cy="${s[1].toFixed(1)}" r="10" fill="${b.c}" stroke="#C9D6D2" stroke-width="1.2"/><circle cx="${(s[0]-3).toFixed(1)}" cy="${(s[1]-3.5).toFixed(1)}" r="3" fill="#fff" opacity=".7"/>`:`<g transform="translate(${s[0].toFixed(1)} ${s[1].toFixed(1)})"><path d="M0 -11 C8 -9 10 -1 7 6 Q0 10 -7 6 C-10 -1 -8 -9 0 -11Z" fill="#F7E3D0" stroke="#C99A7A" stroke-width="1"/><path d="M0 -9 V8 M-3.5 -8 Q-4.5 0 -3.5 7 M3.5 -8 Q4.5 0 3.5 7" stroke="#D9A88A" stroke-width=".8" fill="none"/></g>`; }).join('');
    const shellsLeft=(g.bag.pupu||0)-beads.filter(b=>b.t==='s').length;
    $('#kPal').innerHTML=g.pearls.map((c,i)=>`<button class="bead" data-p="${i}" ${used.has(i)||beads.length>=N?'disabled':''} aria-label="Pearl"><span class="pearl" style="background:${c}"></span></button>`).join('')+`<button class="bead" data-s="1" ${shellsLeft<=0||beads.length>=N?'disabled':''} aria-label="Shell"><svg viewBox="-12 -12 24 24" width="26" height="26"><path d="M0 -11 C8 -9 10 -1 7 6 Q0 10 -7 6 C-10 -1 -8 -9 0 -11Z" fill="#F7E3D0" stroke="#C99A7A"/></svg><span class="small">×${shellsLeft}</span></button>`;
    $$('#kPal .bead').forEach(b=>b.onclick=()=>{ if(b.dataset.p!==undefined){ const i=+b.dataset.p; used.add(i); beads.push({t:'p',c:g.pearls[i],i}); } else beads.push({t:'s'}); sfx('tap'); draw(); });
    $('#kN').textContent=`${beads.length} / ${N}`; $('#kGo').disabled=!(beads.length===N && beads.some(b=>b.t==='p')); };
  $('#kUndo').onclick=()=>{ const b=beads.pop(); if(b&&b.t==='p') used.delete(b.i); draw(); };
  $('#kGo').onclick=()=>{ const shells=beads.filter(b=>b.t==='s').length; g.pearls=g.pearls.filter((_,i)=>!used.has(i)); take({pupu:shells}); S.crafts=S.crafts||{}; S.crafts.hei={beads:beads.map(b=>b.t==='p'?{t:'p',c:b.c}:{t:'s'})}; S.acc.necklace=true; save(); finishCraft('hei',`${N-shells} pearl${N-shells>1?'s':''} and ${shells} shell${shells===1?'':'s'} on a cord.`); };
  draw(); }

/* --- tapa: beat, dry, decorate --- */
function craftTapa(el){ const g=G(); const dyes=CRAFTS.tapa.any.filter(k=>(g.bag[k]||0)>0); let dye=dyes[0], motif='fern', beats=0; const st=[]; let phase='beat';
  el.innerHTML=`<div class="art" style="background:#5A3A1E"><svg viewBox="0 0 300 180" id="tSvg" role="img" aria-label="Bark on a wooden anvil"><rect width="300" height="180" fill="#3E5A3A"/><rect x="20" y="118" width="260" height="30" rx="8" fill="#6B4426"/><rect x="20" y="118" width="260" height="6" rx="3" fill="#8A5A2B"/><rect id="tBark" x="130" y="40" width="40" height="80" rx="3" fill="#E8D6B0" stroke="#C9B48A" stroke-width="1.5"/><g id="tSt"></g><g id="tStones"></g><g id="tIe" style="transform-box:fill-box;transform-origin:100% 50%;transition:transform .09s"><rect x="186" y="12" width="70" height="16" rx="4" fill="#5A3A1E"/>${Array.from({length:7},(_,i)=>`<path d="M${190+i*7} 14 v12" stroke="#3A2412" stroke-width="1.2"/>`).join('')}<rect x="250" y="16" width="34" height="8" rx="4" fill="#7A5230"/></g></svg></div>
    <div class="card" id="tCard"><p class="small">Soak the <span class="reo">ʻuru</span> bark, then beat it with the <span class="reo">ʻiʻe</span> to make it wider and thinner.</p><div class="meter"><div class="f" id="tM"></div></div><span class="fb" id="tFb" aria-live="polite">0 / 24 beats</span></div>
    <button class="btn sun" id="tGo" style="min-height:66px;font-size:1.1rem">Beat with the ʻiʻe</button><div id="tDeco"></div>`;
  const svg=$('#tSvg');
  $('#tGo').onclick=()=>{ if(phase!=='beat') return; beats++; const w=40+beats*(220/24); const b=$('#tBark'); b.setAttribute('width',w.toFixed(1)); b.setAttribute('x',(150-w/2).toFixed(1)); $('#tM').style.width=(beats/24*100)+'%'; $('#tFb').textContent=`${beats} / 24 beats`;
    const ie=$('#tIe'); ie.style.transform='rotate(-14deg) translate(-'+(beats%2?20:40)+'px,34px)'; setTimeout(()=>{ ie.style.transform=''; },110); if(S.sound){ const a=ac(); if(a) drum(a.currentTime+.01); }
    if(beats>=24){ phase='dry'; $('#tGo').disabled=true; $('#tGo').textContent='Drying in the shade…'; $('#tFb').className='fb good'; $('#tFb').textContent='Four or five times wider!'; $('#tStones').innerHTML=[[42,44],[258,44],[42,114],[258,114]].map(p=>`<ellipse cx="${p[0]}" cy="${p[1]}" rx="8" ry="6" fill="#8A9BA6"/>`).join(''); later(decorate,1500); } };
  const decorate=()=>{ phase='deco'; $('#tGo').hidden=true; $('#tCard').innerHTML='<p class="small">Dry and soft. Now decorate it: choose a colour and a motif, then tap the tapa to print.</p>';
    $('#tDeco').innerHTML=`<div class="card"><div class="row" id="tDyes">${dyes.map(k=>`<button class="btn sm ${k===dye?'primary':'ghost'}" data-d="${k}"><span class="dot" style="background:${DYES[k].c}"></span>${BAGN[k]}</button>`).join('')}</div><div class="row" id="tMot">${Object.keys(MOTIFN).map(k=>`<button class="btn sm ${k===motif?'primary':'ghost'}" data-m="${k}">${MOTIFN[k]}</button>`).join('')}</div><p class="small muted" id="tN">0 of 10 prints</p></div><button class="btn sun" id="tDone" disabled style="width:100%;margin-top:12px">Finish the tapa</button>`;
    $$('#tDyes .btn').forEach(b=>b.onclick=()=>{ dye=b.dataset.d; $$('#tDyes .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); });
    $$('#tMot .btn').forEach(b=>b.onclick=()=>{ motif=b.dataset.m; $$('#tMot .btn').forEach(x=>x.className='btn sm '+(x===b?'primary':'ghost')); });
    $('#tDone').onclick=()=>{ const used=[...new Set(st.map(s=>s.d))]; const use={bark:2}; used.forEach(d=>{ use[d]=1; }); take(use); S.crafts=S.crafts||{}; S.crafts.tapa={c:DYES[st[0].d].c, st:st.map(s=>({k:s.k,x:s.x,y:s.y,c:DYES[s.d].c}))}; save(); finishCraft('tapa',`Beaten from ʻuru bark and printed with ${used.map(d=>BAGN[d]).join(' and ')}.`); }; };
  svg.addEventListener('pointerdown',e=>{ if(phase!=='deco'||st.length>=10) return; const [x,y]=svgPoint(svg,e,300,180); if(x<30||x>270||y<44||y>116) return; st.push({k:motif,x:Math.round(x),y:Math.round(y),d:dye}); sfx('tap');
    $('#tSt').insertAdjacentHTML('beforeend',`<g transform="translate(${Math.round(x)} ${Math.round(y)}) scale(.8)">${leafG(motif,DYES[dye].c)}</g>`); $('#tN').textContent=`${st.length} of 10 prints`; $('#tDone').disabled=st.length<3; }); }

/* ---------- ʻāʻai: legends ---------- */
const LEGENDS={
  hina:{isl:'tahiti', at:[178,300], t:'Hina and the eel', sub:'How the coconut palm was born',
    art:()=>`<svg viewBox="0 0 360 200" aria-hidden="true"><defs>${vgrad('lgH','#8ED0EE','#DFF3EE',0,120)}</defs><rect width="360" height="200" fill="url(#lgH)"/><path d="M0 120 L60 60 L110 100 L170 40 L230 96 L300 50 L360 110 V200 H0Z" fill="#4F9E72"/><path d="M-10 170 Q90 140 180 160 T370 150 V200 H-10Z" fill="#3E8FB0"/><path d="M40 168 q20 -10 40 0 t40 0 t40 0" stroke="#2B4A3A" stroke-width="6" fill="none" stroke-linecap="round"/><circle cx="162" cy="166" r="3" fill="#2B4A3A"/>${palmG(250,190,.8,false)}<g transform="translate(300 150)"><circle r="22" fill="#7A5230" stroke="#5A3A1E" stroke-width="2"/><circle cx="-7" cy="-5" r="3.6" fill="#3A2412"/><circle cx="7" cy="-5" r="3.6" fill="#3A2412"/><circle cx="0" cy="6" r="3.6" fill="#3A2412"/></g></svg>`,
    pages:['Long ago, Hina was promised to the Prince of Eels, the ruler of the rivers. She did not want him, and ran to Hiro for help.',

      'When she came back, the head had become a tall tree with long leaves like hair: the first coconut palm. Look at a coconut: its three dark spots are the eel’s two eyes and mouth. Years later, in a dry season, Hina drank from a coconut, and so she kissed the eel after all.'],
    reward:()=>{ addSeeds(2,'haari'); return '2 haʻari (coconut) seeds for your faʻaʻapu'; }, words:['haari','aai'],
    src:'A Tahitian telling recorded in Arue (USC Digital Folklore Archives). Many versions are told across Polynesia.'},
  pai:{isl:'moorea', at:[240,226], t:'Pai and the pierced mountain', sub:'Why Mouaputa has a hole',
    art:()=>`<svg viewBox="0 0 360 200" aria-hidden="true"><defs>${vgrad('lgP','#0B1834','#2C4E7A',0,150)}</defs><rect width="360" height="200" fill="url(#lgP)"/><circle cx="300" cy="44" r="16" fill="#FFF3C4"/>${[[40,30],[90,60],[150,24],[220,50],[260,90]].map(s=>`<circle cx="${s[0]}" cy="${s[1]}" r="1.4" fill="#FFF6D8"/>`).join('')}<path d="M120 160 L170 70 L196 40 L214 72 L250 160Z" fill="#2E5A45"/><circle cx="200" cy="68" r="8" fill="#5A80B0"/><circle cx="200" cy="68" r="8" fill="none" stroke="#FFD08A" stroke-width="1" opacity=".6"/><path d="M10 120 Q100 40 196 66" stroke="#FFD08A" stroke-width="2" stroke-dasharray="5 5" fill="none"/><path d="M-10 160 H370 V200 H-10Z" fill="#14324A"/><path d="M0 150 L30 120 L70 150Z" fill="#1E3F30"/></svg>`,
    pages:['One night, Hiro and his companions sailed from Raiatea to steal Mount Rotui, the sacred mountain of Moʻorea. They tied long vines around its peak and began to pull.',
      'Part of the mountain broke away: the legend says this is how Moʻorea’s two bays were made. Across the water on Tahiti, the warrior Pai woke up, climbed a hill and threw his spear of hibiscus wood.',
      'The spear went straight through a mountain and left a hole: Mouaputa, the pierced mountain. The blow woke the roosters, and they crowed. Thinking dawn had come, the thieves ran away. You can still see the hole in Mouaputa today.'],
    reward:()=>{ addSeeds(2,'aute'); return '2 ʻaute (hibiscus) seeds, the wood of Pai’s spear'; }, words:['aute','aai'],
    src:'As told by Tahiti Tourisme. The mountain’s older name is said to be Mouʻa Tapu, the sacred mountain.'},
  oro:{isl:'bora', at:[234,290], t:'ʻOro and the rainbow', sub:'A god on Mount Pahia',
    art:()=>`<svg viewBox="0 0 360 200" aria-hidden="true"><defs>${vgrad('lgO','#6FA8D8','#FCD9B4',0,150)}</defs><rect width="360" height="200" fill="url(#lgO)"/>${['#E4583F','#F0A23A','#F2C94C','#3B8C58','#1AA3B1','#5B6FB8'].map((c,i)=>`<path d="M${70+i*6} 170 A${110-i*6} ${120-i*6} 0 0 1 ${290-i*6} 170" fill="none" stroke="${c}" stroke-width="6" opacity=".55"/>`).join('')}<path d="M110 170 L130 90 L150 70 L170 76 L176 120 L190 170Z" fill="#46765D"/><path d="M180 170 L210 110 L224 100 L238 112 L262 170Z" fill="#4E8466"/><path d="M-10 168 H370 V200 H-10Z" fill="#22BCC2"/><ellipse cx="240" cy="182" rx="40" ry="7" fill="#7FDDD8"/><circle cx="240" cy="180" r="7" fill="#2B3036" stroke="#C9D6D2" stroke-width="1.5"/><circle cx="237.5" cy="177.5" r="2" fill="#fff" opacity=".7"/></svg>`,
    pages:['ʻOro, god of war and of peace, lived with his sisters on Mount Pahia, the peak beside Otemanu. He wished for a wife, and came down to earth on a rainbow, disguised as a warrior.',
      'His sisters saw Vairaumati bathing in a pool at Vaitape. Every morning ʻOro came down the rainbow to meet her, and every evening he went back up to Pahia. His brothers brought red feathers as wedding gifts.',
      'Some say ʻOro also gave her a black pearl as a token of his love. Pearls are farmed in Polynesia’s lagoons to this day.'],
    reward:()=>{ const g=G(); g.pearls.push('#2B3036'); oysters(); save(); return 'Your first black pearl, and a pearl line in your faʻaʻapu'; }, words:['poe','aai'],
    src:'After Teuira Henry, Ancient Tahiti. The pearl is a later addition to the story.'},
  ruataata:{garden:true, t:'Ruataʻata and the ʻuru', sub:'The tree that saved a family',
    art:()=>`<svg viewBox="0 0 360 200" aria-hidden="true"><defs>${vgrad('lgR','#1D2A4A','#5A4A6A',0,200)}</defs><rect width="360" height="200" fill="url(#lgR)"/><circle cx="70" cy="50" r="18" fill="#FFF3C4"/><path d="M0 180 Q180 160 360 180 V200 H0Z" fill="#2E4A3A"/><g transform="translate(118 26) scale(1.3)">${plantSVG('uru',3).replace('<svg ','<svg width="120" height="126" ')}</g><g transform="translate(270 150)"><path d="M-24 0 L0 -22 L24 0Z" fill="#9A6A3A"/><rect x="-20" y="0" width="40" height="24" fill="#E9D3A8"/></g></svg>`,
    pages:['A great famine struck Raiatea. Ruataʻata, his wife Rumauariʻi and their children had nothing left to eat but mountain ferns.',
      'Exhausted, Ruataʻata wished to become a tree that could feed his children: his hands would be its leaves, his body the trunk and branches, his head the fruit, and his tongue its heart.',
      'In the morning, his wife found a breadfruit tree full of ripe fruit beside the house. The family was saved. That is why the ʻuru is called a tree of life.'],
    reward:()=>{ addSeeds(1,'uru'); bagAdd({bark:1}); return '1 ʻuru seed and 1 strip of ʻuru bark'; }, words:['uru','aai'],
    src:'A legend of Raiatea, as retold by Welcome Tahiti.'},
  hinamoon:{garden:true, t:'Hina in the moon', sub:'The woman who beats tapa',
    art:()=>`<svg viewBox="0 0 360 200" aria-hidden="true"><defs>${vgrad('lgM','#050D24','#22406A',0,200)}</defs><rect width="360" height="200" fill="url(#lgM)"/><circle cx="200" cy="80" r="56" fill="#FFF3C4"/><g fill="#D9CC9E" opacity=".9"><path d="M186 120 Q184 96 196 80 Q186 74 176 78 Q186 70 198 74 Q200 60 212 56 Q206 70 210 78 Q222 72 232 78 Q220 82 210 86 Q212 100 214 120Z"/></g><path d="M-10 160 Q180 150 370 160 V200 H-10Z" fill="#14324A"/><g transform="translate(70 158)"><path d="M-18 0 Q0 5 18 0 L14 4 Q0 8 -14 4Z" fill="#7A5230"/><path d="M0 -1 V-16 L10 -4Z" fill="#EADBB8"/></g></svg>`,
    pages:['Hina loved to discover. She sailed with her brother Ru to find the islands, keeping watch from the bow for land.',
      'One full-moon evening she set off in her canoe to visit the moon. She stepped onto it, and her canoe drifted away, never to be seen again. She stayed: the woman in the moon, who watches over travellers and beats tapa.',
      'The shadows on the moon are a banyan tree, the ʻōrā. One of its branches fell to ʻŌpoa, on Raiatea, and became the first banyan on earth. Its bark, like the ʻuru’s, can be beaten into tapa.'],
    reward:()=>{ bagAdd({bark:1}); addSeeds(1,'tiairi'); return '1 strip of bark and 1 tiʻaʻiri seed for a black dye'; }, words:['ora','marama','tapa','aai'],
    src:'After Teuira Henry, Ancient Tahiti (Hōkūleʻa archive).'}
};
function openLegend(id,fromGarden){ const L=LEGENDS[id]; let p=0; ac();
  openFull(`<div class="fhead"><div><div class="eyebrow">ʻĀʻai · Legend${L.isl?' of '+ISL[L.isl].r:''}</div><h2>${L.t}</h2></div>${XBTN}</div><div class="fbody" id="lb"></div>`,'',fromGarden?()=>openGarden():null);
  const draw=()=>{ const last=p===L.pages.length-1; const first=!(S.legends&&S.legends[id]);
    $('#lb').innerHTML=`<div class="art">${L.art()}</div><div class="card"><p>${L.pages[p]}</p><div class="row" style="justify-content:space-between"><span class="prog">${prog(p+1,L.pages.length)}</span><span class="small muted">${p+1} of ${L.pages.length}</span></div></div>
      ${last?`<div class="card flat"><p class="small muted">${L.src}</p></div>`:''}
      <div class="row">${p>0?'<button class="btn ghost" id="lBack">Back</button>':''}<button class="btn ${last?'sun':'primary'}" id="lNext" style="flex:1">${last?(first?'Receive a gift':'Close'):'Next'}</button></div>`;
    if($('#lBack')) $('#lBack').onclick=()=>{ p--; draw(); };
    $('#lNext').onclick=()=>{ if(!last){ p++; sfx('tap'); draw(); $('#lb').scrollTop=0; return; }
      if(!first){ closeFull(); return; }
      S.legends=S.legends||{}; S.legends[id]=true; const gift=L.reward(); learn(L.words,true); save(); sfx('stamp');
      $('#lb').innerHTML=`<div class="art">${L.art()}</div><div class="card" style="align-items:center;text-align:center"><div class="eyebrow">A gift from the legend</div><h3>${gift}</h3><div class="birdbox">${birdSVG(S,'lg')}</div><p class="small">${Object.keys(LEGENDS).filter(k=>S.legends[k]).length} of ${Object.keys(LEGENDS).length} legends heard.</p></div><button class="btn primary" id="lDone">${fromGarden?'Back to the garden':L.isl?'Back to '+ISL[L.isl].en:'Close'}</button>`;
      $('#lDone').onclick=()=>closeFull(); }; };
  draw(); }

const PO=['Tireo','Hiro hiti','Hoʻata','Hāmiamia mua','Hāmiamia roto','Hāmiamia muri','ʻOreʻore mua','ʻOreʻore roto','Tamatea','Huna','Rapu','Maharu','ʻŌhua','Māitu','Hotu','Māraʻi','Turu','Rāʻau mua','Rāʻau roto','Rāʻau muri','ʻOreʻore mua','ʻOreʻore roto','ʻOreʻore muri','Taʻaroa mua','Taʻaroa roto','Taʻaroa muri','Tāne','Roʻo nui','Roʻo mauri','Mutu'];
function moonNight(){ let a=moonAge(Date.now())-1; if(a<0) a+=29.530588853; return Math.min(30,Math.floor(a)+1); }
function moonName(){ const p=moonAge(Date.now())/29.530588853; return (p<.03||p>.97)?'new moon':p<.22?'waxing crescent':p<.28?'first quarter':p<.47?'waxing gibbous':p<.53?'full moon':p<.72?'waning gibbous':p<.78?'last quarter':'waning crescent'; }
function bigMoon(cx,cy,r){ const p=moonAge(Date.now())/29.530588853, rx=Math.max(.01,r*Math.abs(Math.cos(2*Math.PI*p))), wax=p<.5; const outer=wax?0:1, term=wax?(p<.25?1:0):(p<.75?1:0);
  return `<circle cx="${cx}" cy="${cy}" r="${r+7}" fill="#FFF1C4" opacity=".1"/><circle cx="${cx}" cy="${cy}" r="${r}" fill="#243A52"/><path d="M${cx} ${cy-r} A${r} ${r} 0 0 ${outer} ${cx} ${cy+r} A${rx.toFixed(2)} ${r} 0 0 ${term} ${cx} ${cy-r}Z" fill="#FFF1C4"/>`; }
const SKYST={sel:null, quiz:null, flash:null, done:undefined};
function skyKnown(){ if(!Array.isArray(S.sky)) S.sky=[]; return S.sky; }
function skyMapSVG(){ const quiz=!!SKYST.quiz; let h=`<defs>${vgrad('trS','#071426','#12304A',0,520)}</defs><rect width="360" height="520" fill="url(#trS)"/>`;
  const r=seeded(7); for(let i=0;i<80;i++) h+=`<circle cx="${(r()*360).toFixed(0)}" cy="${(r()*520).toFixed(0)}" r="${(.5+r()*.9).toFixed(1)}" fill="#fff" opacity="${(.25+r()*.4).toFixed(2)}"/>`;
  h+='<path d="M-20 520 Q160 330 380 120" stroke="#A9C1F0" stroke-opacity=".13" stroke-width="86" fill="none" stroke-linecap="round"/><path d="M-20 520 Q160 330 380 120" stroke="#DCE8FF" stroke-opacity=".12" stroke-width="34" fill="none" stroke-linecap="round"/>';
  h+='<g data-sky="vaiora" class="tapable"><path d="M-20 520 Q160 330 380 120" stroke="#fff" stroke-opacity="0" stroke-width="64" fill="none" pointer-events="stroke"/></g>';
  SKY.forEach(o=>{ if(o.id==='vaiora') return; const sel=SKYST.sel===o.id&&!quiz, fl=SKYST.flash&&SKYST.flash.id===o.id;
    let g=`<g data-sky="${o.id}" class="tapable"><circle cx="${o.hit[0]}" cy="${o.hit[1]}" r="${o.hit[2]}" fill="#fff" fill-opacity="${fl?.16:sel?.08:0}" stroke="${fl?(SKYST.flash.ok?'#62C486':'#FF7A62'):'#FFE9A8'}" stroke-opacity="${fl?1:sel?.9:0}" stroke-width="2"/>`;
    o.lines.forEach(l=>{ const a=o.pts[l[0]], b=o.pts[l[1]]; g+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#CFE0FF" stroke-opacity=".45" stroke-width="1.2"/>`; });
    o.pts.forEach(pt=>{ const c=pt[3]||'#FFFFFF'; g+=`<circle cx="${pt[0]}" cy="${pt[1]}" r="${pt[2]*2.4}" fill="${c}" opacity=".16"/><circle cx="${pt[0]}" cy="${pt[1]}" r="${pt[2]}" fill="${c}"/>`; });
    if(o.id==='marama') g+=bigMoon(312,48,19);
    h+=g+'</g>'; });
  if(!quiz) SKY.forEach(o=>{ const k=skyKnown().includes(o.id); h+=`<text x="${o.lab[0]}" y="${o.lab[1]}" text-anchor="${o.lab[2]}" font-family="Fredoka,Nunito,sans-serif" font-weight="600" font-size="12.5" fill="${SKYST.sel===o.id?'#FFE9A8':'#DCE8FF'}" pointer-events="none">${o.ty}${k?' ✓':''}</text>`; });
  return `<svg viewBox="0 0 360 520" id="skySvg" role="img" aria-label="Map of the night sky" style="width:100%;height:auto;display:block;touch-action:manipulation">${h}</svg>`; }
function openSky(){ const keep=$('#skyBox')?$('#fullIn .fbody').scrollTop:0; const Q=SKYST.quiz, n=skyKnown().length; let panel;
  if(Q){ const w=SKY.find(x=>x.id===Q.q[Q.i]); panel=`<div class="card"><div class="eyebrow">Question ${Q.i+1} of ${Q.q.length} · ${Q.score} found first time</div><h3>Where is ${w.ty}?</h3><p class="small muted">${Q.msg||('Hint: '+w.en+', '+w.sens+'.')}</p><button class="btn sm ghost" data-skyb="stop">Stop the game</button></div>`; }
  else { const o=SKY.find(x=>x.id===SKYST.sel);
    const info=o?`<div class="card"><div class="eyebrow">${o.en} · ${o.sens}</div><h3 class="reo">${o.ty}</h3><p class="small">${o.txt}</p></div>`:'<div class="card flat"><p class="small">Tap a star or a group of stars to learn its name in Reo Tahiti and its story.</p></div>';
    const dn=typeof SKYST.done==='number'?`<div class="card flat"><p><b>${SKYST.done} of 5</b> found first time. ${SKYST.done>=4?'You read the sky like a navigator!':'Look at the map again, then play once more.'}</p></div>`:'';
    panel=`${dn}${info}<button class="btn primary" data-skyb="quiz">Play: find the star</button><p class="small muted" style="text-align:center">You know ${n} of ${SKY.length} stars.${n<SKY.length?' Learn them all to give your manu a cloak of stars.':' Your manu can wear its cloak of stars.'}</p>`; }
  const nn=moonNight();
  const html=`<div class="fhead"><div><div class="eyebrow">The sky of the fenua</div><h2>Te raʻi</h2></div>${XBTN}</div>
    <div class="fbody"><div id="skyBox" class="stack" style="gap:12px"><div class="art">${skyMapSVG()}</div>${panel}
    <div class="card flat"><div class="row" style="flex-wrap:nowrap;gap:12px"><svg viewBox="0 0 60 60" style="width:56px;height:56px;flex:none" aria-hidden="true"><rect width="60" height="60" rx="14" fill="#0B1C2E"/>${bigMoon(30,30,19)}</svg><div style="min-width:0"><div class="eyebrow">Marama · the moon tonight</div><b>${moonName()}</b><div class="small muted">Night ${nn} of the moon: <b class="reo">${PO[nn-1]}</b></div></div></div></div>
    <div class="card flat"><div class="eyebrow">Steering by the stars</div><p class="small">Navigators followed star paths. Each island has its <b>ʻaveiʻa</b>, a star that passes right over it: for Tahiti, Taʻurua-faupapa. Try it yourself on a voyage between the islands.</p></div>
    <p class="small muted">A simplified map: the shapes are right, the distances are not, and not all these stars are up on the same night. Names vary between islands and sources.</p></div></div>`;
  if($('#skyBox')) $('#fullIn').innerHTML=html; else openFull(html);
  $('#fullIn [data-close]').onclick=()=>{ SKYST.quiz=null; SKYST.flash=null; SKYST.done=undefined; closeFull(); };
  $('#fullIn .fbody').scrollTop=keep;
  $('#skyBox').addEventListener('click',e=>{ const b=e.target.closest('[data-skyb]'); if(b){ if(b.dataset.skyb==='quiz'){ SKYST.quiz={q:shuffle(SKY.map(o=>o.id)).slice(0,5),i:0,score:0,miss:false,msg:''}; SKYST.sel=null; SKYST.done=undefined; } else { SKYST.quiz=null; } openSky(); return; }
    const g=e.target.closest('[data-sky]'); if(!g) return; const id=g.getAttribute('data-sky'); ac();
    if(SKYST.quiz) skyAnswer(id); else { SKYST.sel=id; SKYST.done=undefined; sfx('tap'); openSky(); } }); }
function skyAnswer(id){ const Q=SKYST.quiz; if(!Q||SKYST.flash) return; const want=Q.q[Q.i], o=SKY.find(x=>x.id===id), w=SKY.find(x=>x.id===want);
  if(id===want){ if(!Q.miss){ Q.score++; const k=skyKnown(); if(!k.includes(want)){ k.push(want); learn(want==='marama'?'marama':want,true); save(); if(k.length===SKY.length){ S.acc.stars=true; save(); later(()=>toast('You know the whole sky: your manu’s <b>cloak of stars</b> is ready!',3800),1200); } } }
    Q.msg=`Yes! ${w.ty}, ${w.en}.`; SKYST.flash={id,ok:true}; sfx('good'); openSky();
    later(()=>{ SKYST.flash=null; Q.i++; Q.miss=false; Q.msg=''; if(Q.i>=Q.q.length){ const sc=Q.score; SKYST.quiz=null; SKYST.done=sc; if(!S.skyGift && sc>=3){ S.skyGift=true; addSeeds(2); save(); later(()=>toast('A gift from the sky: 2 seeds for your faʻaʻapu'),600); } } if($('#skyBox')) openSky(); },1100); }
  else { Q.miss=true; Q.msg=`Close. That one is ${o.ty} (${o.en}). Keep looking.`; SKYST.flash={id,ok:false}; sfx('bad'); openSky(); later(()=>{ SKYST.flash=null; if($('#skyBox')) openSky(); },900); } }
