<!doctype html>
<html lang="en" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<meta name="theme-color" content="#0E4C6B">
<meta name="description" content="Manu Tere: sail the islands of French Polynesia with a voyaging bird, steer by the stars and learn Reo Māʻohi.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Manu Tere</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: a one-screen phone app. The island scene fills the stage and the manu walks its beach; activity pins sit on the drawing; the dock sits below; activities and the voyage open full screen, information opens in bottom sheets. */
:root{
  --bg:#E8F3F2;          /* lagoon-tinted white */
  --surface:#FFFFFF;
  --surface-2:#DAECEB;
  --fg:#0D2C3D;          /* deep ocean ink */
  --muted:#4F6F7D;
  --line:#C3DCDB;
  --ocean:#0E4C6B;       /* brand: open sea */
  --lagoon:#1AA3B1;
  --sunset:#D9562E;      /* accent: the voyage */
  --reo:#B8431F;         /* Reo words in text (5:1 on white) */
  --gold:#E9B93A;        /* stars, stamps */
  --fern:#2F7D4C;
  --btn:#0E6A80; --btn-ink:#FFFFFF;
  --scrim:rgba(6,24,34,.5);
  --shadow:0 10px 28px rgba(13,44,61,.16);
  --display:"Fredoka","Nunito","Trebuchet MS","Segoe UI",sans-serif;
  --body:"Nunito","Segoe UI",Helvetica,Arial,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1A26; --surface:#122E3E; --surface-2:#0F2533; --fg:#E6F2F2; --muted:#9DBAC3; --line:#24465A;
    --ocean:#8FD3EA; --lagoon:#38C8D3; --sunset:#FF8A5C; --reo:#FFA27E; --gold:#F5D46A; --fern:#62C486;
    --btn:#38C8D3; --btn-ink:#0A1A26; --scrim:rgba(0,0,0,.6); --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1A26; --surface:#122E3E; --surface-2:#0F2533; --fg:#E6F2F2; --muted:#9DBAC3; --line:#24465A;
  --ocean:#8FD3EA; --lagoon:#38C8D3; --sunset:#FF8A5C; --reo:#FFA27E; --gold:#F5D46A; --fern:#62C486;
  --btn:#38C8D3; --btn-ink:#0A1A26; --scrim:rgba(0,0,0,.6); --shadow:0 10px 28px rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{margin:0;font-family:var(--body);font-size:16px;line-height:1.45;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--lagoon);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.6rem} h2{font-size:1.3rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)} .small{font-size:.86rem}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.reo{font-family:var(--display);font-weight:600;color:var(--reo)}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* buttons */
.btn{border:0;border-radius:14px;padding:12px 16px;min-height:46px;background:var(--surface-2);font-family:var(--display);font-weight:600;font-size:1rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;color:var(--fg)}
.btn.primary{background:var(--btn);color:var(--btn-ink)}
.btn.sun{background:var(--sunset);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:.9rem;border-radius:12px}
.btn:disabled{opacity:.45;cursor:default}
.ibtn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0;flex:none}
.ibtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.spk{width:36px;height:36px;border-radius:50%;border:0;background:var(--surface-2);display:inline-grid;place-items:center;padding:0;flex:none;color:var(--fg)}
.spk svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* app frame */
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.top{display:flex;align-items:center;gap:10px;padding:8px 16px;background:var(--bg);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.logo{width:40px;height:40px;border-radius:13px;background:var(--ocean);display:grid;place-items:center;flex:none;overflow:hidden}
.logo svg{width:40px;height:40px}
.brand .t{min-width:0}
.brand h1{font-size:1.2rem;color:var(--fg)}
.brand .isl{font-size:.82rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand .isl b{font-family:var(--display);font-weight:600;color:var(--reo)}
.stage{flex:1;position:relative;overflow:hidden;min-height:0;background:#BFE5F2}
.stage>svg.scene{position:absolute;inset:0;width:100%;height:100%;display:block}
.pins{position:absolute;inset:0;pointer-events:none;z-index:3}
.pin{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px 5px 5px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 16px rgba(6,24,34,.28);font-family:var(--display);font-weight:600;font-size:.86rem;line-height:1.05;text-align:left;transform:translate(-50%,-50%);width:max-content;max-width:200px}
.pin .ic{width:34px;height:34px;border-radius:50%;background:var(--sunset);display:grid;place-items:center;flex:none;position:relative}
.pin .ic svg{width:21px;height:21px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pin .ic::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--sunset);opacity:0;animation:ping 2.4s ease-out infinite}
.pin.done .ic{background:var(--fern)}
.pin.done .ic::after{display:none}
.pin small{display:block;font-family:var(--body);font-weight:400;font-size:.72rem;color:var(--muted)}
@keyframes ping{0%{transform:scale(.8);opacity:.8}80%,100%{transform:scale(1.5);opacity:0}}
.dock{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1.5px solid var(--line);position:relative;z-index:5}
.dock button{border:0;background:none;padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--display);font-weight:600;font-size:.8rem;color:var(--fg);min-height:58px}
.dock button small{font-family:var(--body);font-weight:400;font-size:.68rem;color:var(--muted)}
.dock svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* bird (from Manu Ora) */
.birdlayer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.bird{position:absolute;left:0;top:0;width:84px;height:77px;pointer-events:auto;cursor:pointer;will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.bird .flip,.bird .bob{width:100%;height:100%;transform-origin:50% 50%}
.bird svg,.birdbox svg{width:100%;height:100%;overflow:visible;display:block;filter:drop-shadow(0 6px 6px rgba(0,0,0,.18))}
.bird .wing,.birdbox .wing{transform-origin:48px 60px;transform-box:view-box}
.bird .leg{transform-origin:50px 88px;transform-box:view-box}
.bird .eye,.birdbox .eye{transform-origin:89px 42px;transform-box:view-box;animation:blink 5.5s infinite}
.bird .head,.birdbox .head{transform-origin:70px 60px;transform-box:view-box}
.bird.flying .wing,.birdbox.flying .wing{animation:flap .22s ease-in-out infinite alternate}
.bird.walking .leg.l1{animation:step .36s ease-in-out infinite alternate}
.bird.walking .leg.l2{animation:step .36s ease-in-out infinite alternate-reverse}
.bird.walking .bob{animation:bob .36s ease-in-out infinite alternate}
.bird.pecking .head{animation:peck .5s ease-in-out 2}
.bird.petted .eye{animation:none;transform:scaleY(.12)}
.bird.petted .bob{animation:purr .55s ease-in-out infinite alternate}
.birdbox.dancing .bob,.bird.dancing .bob{animation:ori .26s ease-in-out infinite alternate}
.birdbox.dancing .wing{animation:flap .26s ease-in-out infinite alternate}
.birdbox .bob{width:100%;height:100%}
@keyframes flap{from{transform:rotate(-38deg)}to{transform:rotate(22deg)}}
@keyframes step{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes peck{0%,100%{transform:rotate(0)}50%{transform:rotate(22deg)}}
@keyframes purr{from{transform:rotate(-3deg) scale(1.03)}to{transform:rotate(3deg) scale(1.07)}}
@keyframes ori{from{transform:translateX(-5px) rotate(-8deg)}to{transform:translateX(5px) rotate(8deg)}}
.bubble{position:absolute;left:0;top:0;z-index:6;background:var(--surface);color:var(--fg);border-radius:16px;padding:8px 12px;box-shadow:var(--shadow);max-width:230px;font-size:.92rem;line-height:1.3;opacity:0;transition:opacity .25s;pointer-events:none}
.bubble.show{opacity:1}
.bubble b{font-family:var(--display);font-weight:600;color:var(--reo);font-size:1.05rem;display:block}
.heart{position:absolute;left:0;top:0;width:20px;height:20px;pointer-events:none;animation:floatUp 1.3s ease-out forwards;z-index:6}
@keyframes floatUp{from{opacity:.95;margin-top:0}to{opacity:0;margin-top:-70px}}

/* scene ambience */
.sc-cloud{animation:drift 60s linear infinite}
.sc-sway{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sc-wave{animation:waveY 3.2s ease-in-out infinite}
.sc-bob{animation:bobY 3s ease-in-out infinite;transform-box:fill-box}
.sc-ferry{animation:ferry 46s linear infinite}
.sc-glide{animation:glide 22s linear infinite}
.sc-vaa{animation:vaa 18s linear infinite}
.sc-flame{animation:flame .5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
.sc-twinkle{animation:twinkle 2.4s ease-in-out infinite alternate}
.sc-flow{stroke-dasharray:6 10;animation:flow 1.4s linear infinite}
.sc-foam{animation:foam 4s ease-in-out infinite}
.sc-curl{animation:curl 5s ease-in-out infinite;transform-box:fill-box;transform-origin:0% 100%}
.sc-pop{animation:pop 9s ease-in-out infinite;transform-box:fill-box}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
@keyframes waveY{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes bobY{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-3px) rotate(2deg)}}
@keyframes ferry{from{transform:translateX(120px)}to{transform:translateX(-480px)}}
@keyframes glide{0%{transform:translate(-80px,0)}50%{transform:translate(220px,14px)}100%{transform:translate(520px,0)}}
@keyframes vaa{from{transform:translateX(-120px)}to{transform:translateX(480px)}}
@keyframes flame{from{transform:scale(1,1)}to{transform:scale(.85,1.15)}}
@keyframes twinkle{from{opacity:.35}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-32}}
@keyframes foam{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
@keyframes curl{0%,100%{transform:scale(1)}50%{transform:scale(1.05,1.1)}}
@keyframes pop{0%,70%,100%{transform:translateY(14px);opacity:0}76%,92%{transform:translateY(0);opacity:1}}

/* full-screen layers (activities, map, voyage, welcome) */
.full{position:fixed;inset:0;z-index:40;display:flex;justify-content:center;background:var(--scrim)}
.full .in{width:100%;max-width:520px;height:100%;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);overflow:hidden}
.fhead{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;padding:10px 16px 8px}
.fhead h2{font-size:1.45rem}
.fbody{flex:1;overflow:auto;padding:0 16px 20px;display:flex;flex-direction:column;gap:12px;min-height:0;position:relative}
.fbody>*,.result>*,.sheet>*{flex-shrink:0}
.x{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:1.5rem;line-height:1;flex:none;color:var(--fg)}
.card{background:var(--surface);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-width:0}
.card.flat{box-shadow:none;border:1.5px solid var(--line)}
.art{width:100%;border-radius:var(--r);overflow:hidden;position:relative;background:#0E4C6B;flex:none}
.art svg{display:block;width:100%;height:auto}
.prog{display:flex;gap:6px;align-items:center}
.prog i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block}
.prog i.on{background:var(--sunset)}
.fb{min-height:1.5em;font-weight:700}
.fb.good{color:var(--fern)} .fb.bad{color:var(--reo)}
.shake{animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* market */
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:118px;justify-content:center}
.opt svg{width:84px;height:84px}
.opt span{font-size:.82rem;color:var(--muted);min-height:1.2em}
.opt.ok{border-color:var(--fern);box-shadow:inset 0 0 0 2px var(--fern)}
.basket{display:flex;gap:6px;flex-wrap:wrap;min-height:40px;align-items:center}
.basket svg{width:36px;height:36px}

/* games: big hold/tap buttons */
.pad{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad .btn{min-height:64px;font-size:1.1rem;touch-action:none;user-select:none;-webkit-user-select:none}
.pad .btn.held{filter:brightness(1.15);transform:scale(.98)}
.meter{height:14px;border-radius:99px;background:var(--surface-2);overflow:hidden;position:relative}
.meter .f{position:absolute;left:0;top:0;bottom:0;background:var(--lagoon);border-radius:99px;width:0}
.meter .z{position:absolute;top:0;bottom:0;background:var(--fern);opacity:.35}
.meter .m{position:absolute;top:-3px;bottom:-3px;width:4px;border-radius:2px;background:var(--fg)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plant{border:0;border-radius:16px;background:#8C4A2F;aspect-ratio:1;max-width:100%;padding:4px;display:grid;place-items:center}
.plant svg{width:100%;height:100%}
.tapable{cursor:pointer}

/* result */
.result{position:absolute;inset:0;background:var(--bg);padding:8px 16px 20px;overflow:auto;display:flex;flex-direction:column;gap:12px;z-index:3}
.stamp{width:132px;height:132px;margin:6px auto 0;animation:stampIn .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes stampIn{from{transform:scale(2.2) rotate(-18deg);opacity:0}to{transform:scale(1) rotate(-8deg);opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.wchip{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:14px;padding:6px 6px 6px 12px;background:var(--surface)}
.wchip b{font-family:var(--display);font-weight:600;color:var(--reo)}
.wchip span{font-size:.82rem;color:var(--muted)}

/* sheets */
.sheetwrap{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.shead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.wlist{display:flex;flex-direction:column;gap:0}
.wrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow b{font-family:var(--display);font-weight:600;font-size:1.1rem;color:var(--reo)}
.wrow .en{font-size:.92rem}
.wrow .ph{font-size:.8rem;color:var(--muted);font-style:italic}
.wrow .spk{grid-row:1/span 3;grid-column:2}
.wrow.lock b{color:var(--muted)}
.facts{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);padding:0}
.sw.on{box-shadow:0 0 0 3px var(--btn)}
.toggles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.tg{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:58px}
.tg b{font-family:var(--display);font-weight:600}
.tg span{font-size:.76rem;color:var(--muted)}
.tg.on{border-color:var(--btn);box-shadow:inset 0 0 0 2px var(--btn)}
.tg:disabled{opacity:.6}
input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);font-size:1rem;min-height:46px}
.pstamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pst{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.pst svg{width:100%;max-width:112px;height:auto}
.pst .acts{display:flex;gap:4px}
.pst .acts i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);display:block}
.pst .acts i.on{background:var(--fern);border-color:var(--fern)}
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.soon .card{padding:12px}
.soon b{font-family:var(--display);font-weight:600}

/* map */
.mapwrap{position:relative;border-radius:var(--r);overflow:hidden;flex:none}
.mapwrap svg{display:block;width:100%;height:auto}
.isle{cursor:pointer}
.isle:focus-visible{outline:none}
.isle:focus-visible .hit{stroke:#fff;stroke-width:3}

/* voyage */
.vy{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none}
.vy>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.hud{position:absolute;left:12px;right:12px;top:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.hud .card{padding:10px 12px;background:rgba(9,28,44,.72);color:#F1F7FA;box-shadow:none;backdrop-filter:blur(4px)}
.hud .reo{color:#FFD08A}
.hud .muted{color:#BFD3DC}
.vbar{height:8px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:#FFD08A;border-radius:99px}
.vctl{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;padding:10px 16px 12px;align-items:center;background:var(--bg)}
.vctl .btn{min-height:60px;font-size:1.05rem;touch-action:none;user-select:none;-webkit-user-select:none}
.vstat{font-family:var(--display);font-weight:600;text-align:center;min-width:92px;font-size:.92rem}

/* welcome */
.welcome .in{background:linear-gradient(#1C4F78,#F08A5D 62%,#F6C177)}
.welcome .fbody{justify-content:flex-end;gap:14px;padding-bottom:24px}
.welcome .card{background:var(--surface)}
.birdbox{width:150px;height:138px;margin:0 auto}
.welcome .in{position:relative}
.welcome .fbody{position:relative;z-index:1}
.wplane{position:absolute;left:0;top:9%;width:300px;pointer-events:none;animation:planeCross 18s linear infinite;animation-delay:-7s}
.wplane svg,.fplane svg{width:100%;height:auto;display:block}
@keyframes planeCross{from{transform:translate(-300px,12px)}to{transform:translate(560px,-16px)}}
.flyin{position:relative;flex:1;overflow:hidden}
.flyin>svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.fplane{position:absolute;left:0;top:14%;width:86%;transform-origin:70% 50%;animation:planeLand 2.9s ease-in-out forwards}
@keyframes planeLand{0%{transform:translate(-75%,0) rotate(-3deg)}55%{transform:translate(0%,calc(22vh - 20px)) rotate(5deg) scale(.6)}100%{transform:translate(20%,calc(47vh - 42px)) rotate(6deg) scale(.2)}}
.flycap{position:absolute;left:16px;right:16px;bottom:28px;margin:0;text-align:center;color:#FFFFFF;font-family:var(--display);font-weight:600;font-size:1.3rem;text-shadow:0 2px 10px rgba(0,0,0,.4)}

.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;font-size:.92rem;z-index:70;max-width:min(92vw,440px);text-align:center;box-shadow:var(--shadow);animation:tIn .25s ease-out}
@keyframes tIn{from{opacity:0;transform:translate(-50%,-8px)}to{opacity:1;transform:translate(-50%,0)}}
.toast b{font-family:var(--display);font-weight:600}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001s !important;animation-iteration-count:1 !important;transition:none !important}
}

<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo" id="logo" aria-hidden="true"></div>
      <div class="t"><h1>Manu Tere</h1><div class="isl" id="islLabel"></div></div>
    </div>
    <button class="ibtn" id="infoBtn" aria-label="About this island"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
    <button class="ibtn" id="soundBtn" aria-label="Sound on"></button>
  </header>
  <main class="stage" id="stage">

  <nav class="dock" aria-label="Main">

    <button id="dWords"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4Z"/><path d="M8 9h8M8 12.5h5"/></svg>Words<small>Parau</small></button>
    <button id="dPass"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="10.5" r="3.2"/><path d="M8.5 17h7"/></svg>Passport<small>Stamps</small></button>
    <button id="dManu"><svg viewBox="0 0 24 24"><path d="M5 13c0-4 3-7 7-7 3 0 5 2 6 4l3 1-3 1c-1 3-3 6-7 6-4 0-6-2-6-5Z"/><circle cx="15" cy="9.5" r=".6"/><path d="M5 13 2 11l1 4"/></svg>My manu<small>Manu</small></button>
  </nav>
</div>
<div class="full" id="full" hidden><div class="in" id="fullIn"></div></div>
<div class="sheetwrap" id="sheetwrap" hidden><section class="sheet" id="sheet" role="dialog" aria-modal="true"></section></div>
<div class="toast" id="toast" hidden></div>

<script>
(()=>{
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const rnd=(a,b)=>a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ---------- saved progress (this phone only) ---------- */
const KEY='manutere.v1';
const DEF={name:'Tere', body:'#E4583F', belly:'#F6F1E7', acc:{tiare:true,hei:false,pareu:false,titia:false}, island:'tahiti', visited:[], done:{}, words:[], sound:true, onboarded:false, voyages:0, best:{}};
function load(){ try{ const raw=localStorage.getItem(KEY); if(raw){ const o=JSON.parse(raw); return Object.assign(JSON.parse(JSON.stringify(DEF)),o,{acc:Object.assign({},DEF.acc,o.acc||{})}); } }catch(e){} return JSON.parse(JSON.stringify(DEF)); }
let S=load();
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ---------- words (Reo Tahiti) ---------- */
const W={
  iaorana:{r:'ʻIa ora na', en:'hello', ph:'yah OH-rah nah', g:'greet'},
  maeva:{r:'Maeva', en:'welcome', ph:'mah-EH-vah', g:'greet'},
  mauruuru:{r:'Māuruuru', en:'thank you', ph:'MAH-oo-roo-OO-roo', g:'greet'},
  huru:{r:'E aha te huru?', en:'how are you?', ph:'eh AH-hah teh HOO-roo', g:'greet'},
  maitai:{r:'Maitaʻi', en:'good, fine', ph:'my-TAH-ee', g:'greet'},
  nana:{r:'Nana', en:'bye', ph:'NAH-nah', g:'greet'},
  haeremai:{r:'Haere mai', en:'come here', ph:'HAH-eh-reh MAH-ee', g:'greet'},
  aita:{r:'ʻAita peʻapeʻa', en:'no worries', ph:'AH-ee-tah peh-AH-peh-ah', g:'greet'},
  faaitoito:{r:'Faʻaitoito', en:'keep going, courage', ph:'fah-ah-ee-toh-EE-toh', g:'greet'},
  manu:{r:'manu', en:'bird', ph:'MAH-noo', g:'greet'},
  tere:{r:'tere', en:'journey; to travel', ph:'TEH-reh', g:'greet'},
  fenua:{r:'fenua', en:'land, home island', ph:'feh-NOO-ah', g:'greet'},
  matete:{r:'mātete', en:'market', ph:'MAH-teh-teh', g:'tahiti'},
  meia:{r:'meiʻa', en:'banana', ph:'meh-EE-ah', g:'tahiti'},
  vi:{r:'vī', en:'mango', ph:'VEE', g:'tahiti'},
  uru:{r:'ʻuru', en:'breadfruit', ph:'OO-roo', g:'tahiti'},
  haari:{r:'haʻari', en:'coconut', ph:'hah-AH-ree', g:'tahiti'},
  ia:{r:'ʻiʻa', en:'fish', ph:'EE-ah', g:'tahiti'},
  tiare:{r:'tiare', en:'flower; the tiare Tahiti gardenia', ph:'tee-AH-reh', g:'tahiti'},
  faahee:{r:'faʻaheʻe', en:'to surf', ph:'fah-ah-HEH-eh', g:'tahiti'},
  ori:{r:'ʻori', en:'to dance', ph:'OH-ree', g:'tahiti'},
  toere:{r:'tōʻere', en:'wooden slit drum', ph:'TOH-eh-reh', g:'tahiti'},
  heiva:{r:'Heiva', en:'festival of dance, song and sport', ph:'HAY-vah', g:'tahiti'},
  tairoto:{r:'tairoto', en:'lagoon', ph:'tah-ee-ROH-toh', g:'moorea'},
  honu:{r:'honu', en:'sea turtle', ph:'HOH-noo', g:'moorea'},
  fai:{r:'fai', en:'stingray', ph:'FAH-ee', g:'moorea'},
  mao:{r:'maʻo', en:'shark', ph:'MAH-oh', g:'moorea'},
  hou:{r:'hōʻū', en:'parrotfish', ph:'HOH-oo', g:'moorea'},
  oua:{r:'ʻōuʻa', en:'dolphin', ph:'OH-oo-ah', g:'moorea'},
  tohora:{r:'tohorā', en:'humpback whale', ph:'toh-hoh-RAH', g:'moorea'},
  painapo:{r:'painapo', en:'pineapple', ph:'pah-ee-NAH-poh', g:'moorea'},
  toa:{r:'toʻa', en:'coral', ph:'TOH-ah', g:'moorea'},
  vaa:{r:'vaʻa', en:'outrigger canoe', ph:'VAH-ah', g:'bora'},
  hoe:{r:'hoe', en:'paddle; to paddle', ph:'HOH-eh', g:'bora'},
  fafapiti:{r:'fāfā piti', en:'manta ray', ph:'FAH-fah PEE-tee', g:'bora'},
  motu:{r:'motu', en:'islet on the reef', ph:'MOH-too', g:'bora'},
  fetia:{r:'fetiʻa', en:'star', ph:'feh-TEE-ah', g:'sky'},
  matarii:{r:'Matariʻi', en:'the Pleiades', ph:'mah-tah-REE-ee', g:'sky'},
  tautoru:{r:'Tautoru', en:'Orion’s Belt', ph:'tah-oo-TOH-roo', g:'sky'},
  taurua:{r:'Taʻurua-faupapa', en:'Sirius', ph:'tah-OO-roo-ah fow-PAH-pah', g:'sky'},
  anamua:{r:'ʻAna-mua', en:'Antares', ph:'AH-nah MOO-ah', g:'sky'},
  mahana:{r:'mahana', en:'sun; day', ph:'mah-HAH-nah', g:'sky'},
  moana:{r:'moana', en:'ocean', ph:'moh-AH-nah', g:'sky'}
};
const WGROUPS=[['greet','Greetings'],['tahiti','Tahiti'],['moorea','Moʻorea'],['bora','Porapora · Bora Bora'],['sky','Sky and sea']];
function learn(ids, quiet){ const fresh=[]; (Array.isArray(ids)?ids:[ids]).forEach(id=>{ if(W[id] && !S.words.includes(id)){ S.words.push(id); fresh.push(id); } }); if(fresh.length){ save(); if(!quiet) toast(`New word: <b>${esc(W[fresh[0]].r)}</b> · ${esc(W[fresh[0]].en)}`); } return fresh; }

/* ---------- voice: an approximate computer voice for Reo words ---------- */
let VOICE=null;
function pickVoice(){ try{ const vs=speechSynthesis.getVoices(); for(const p of ['mi','id','ms','es','it']){ const v=vs.find(v=>(v.lang||'').toLowerCase().startsWith(p)); if(v) return v; } }catch(e){} return null; }
try{ if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{ VOICE=pickVoice(); }; } }catch(e){}
function speak(txt){ if(!S.sound) return; try{ if(!('speechSynthesis' in window)) return; VOICE=VOICE||pickVoice(); const clean=txt.replace(/[ʻ’'?!]/g,'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/-/g,' '); const u=new SpeechSynthesisUtterance(clean); if(VOICE){ u.voice=VOICE; u.lang=VOICE.lang; } else u.lang='id-ID'; u.rate=.78; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
function sayWord(id){ if(W[id]) speak(W[id].r); }
const SPK='<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>';
function spkBtn(id){ return `<button class="spk" data-say="${id}" aria-label="Listen to ${esc(W[id]?W[id].r:id)}">${SPK}</button>`; }
document.addEventListener('click',e=>{ const b=e.target.closest('[data-say]'); if(b){ e.stopPropagation(); sayWord(b.dataset.say); } });

/* ---------- sound effects, synthesised ---------- */
let AC=null;
function ac(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } } if(AC.state==='suspended') AC.resume(); return AC; }
function pluck(f,t,v,len){ const a=AC, o=a.createOscillator(), o2=a.createOscillator(), g=a.createGain(); o.type='triangle'; o2.type='sine'; o.frequency.value=f; o2.frequency.value=f*2; g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(v,t+.006); g.gain.exponentialRampToValueAtTime(.0001,t+(len||.8)); o.connect(g); o2.connect(g); g.connect(a.destination); o.start(t); o2.start(t); o.stop(t+(len||.8)+.05); o2.stop(t+(len||.8)+.05); }
let NOISE=null;
function noiseBuf(){ if(NOISE) return NOISE; const a=AC, b=a.createBuffer(1,a.sampleRate*.5,a.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; NOISE=b; return b; }
function hit(t,freq,q,vol,len){ const a=AC, s=a.createBufferSource(), f=a.createBiquadFilter(), g=a.createGain(); s.buffer=noiseBuf(); f.type='bandpass'; f.frequency.value=freq; f.Q.value=q; g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+len); s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+len+.02); }
function drum(t){ const a=AC, o=a.createOscillator(), g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(130,t); o.frequency.exponentialRampToValueAtTime(52,t+.16); g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(.32,t+.005); g.gain.exponentialRampToValueAtTime(.0001,t+.3); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.32); }
function sfx(k){ if(!S.sound) return; const a=ac(); if(!a) return; const t=a.currentTime+.01; try{
  if(k==='good'){ pluck(659.25,t,.16,.5); pluck(987.77,t+.1,.14,.7); }
  else if(k==='bad'){ pluck(220,t,.12,.35); }
  else if(k==='tap'){ pluck(783.99,t,.08,.25); }
  else if(k==='toere'){ hit(t,1700,6,.55,.07); hit(t,900,4,.25,.05); }
  else if(k==='pahu'){ drum(t); }
  else if(k==='splash'){ hit(t,900,.7,.25,.28); }
  else if(k==='stamp'){ drum(t); [523.25,659.25,783.99,1046.5].forEach((f,i)=>pluck(f,t+.12+i*.08,.12,.8)); }
  else if(k==='uke'){ [392,523.25,659.25,880].forEach((f,i)=>pluck(f,t+i*.03,.1,1)); }
}catch(e){} }

/* ---------- toast ---------- */
function toast(html,ms){ const el=$('#toast'); el.innerHTML=html; el.hidden=false; el.style.animation='none'; void el.offsetWidth; el.style.animation=''; clearTimeout(toast.t); toast.t=setTimeout(()=>{ el.hidden=true; },ms||2800); }

/* ---------- timers owned by whatever full-screen layer is open ---------- */
const RUN={timers:[],rafs:[],stops:[]};
function later(fn,ms){ const id=setTimeout(fn,ms); RUN.timers.push(id); return id; }
function every(fn,ms){ const id=setInterval(fn,ms); RUN.timers.push(id); return id; }
function frames(fn){ let last=performance.now(), alive=true; const step=now=>{ if(!alive) return; const dt=Math.min(.05,(now-last)/1000); last=now; if(fn(dt,now)===false){ alive=false; return; } RUN.rafs.push(requestAnimationFrame(step)); }; RUN.rafs.push(requestAnimationFrame(step)); const stop=()=>{ alive=false; }; RUN.stops.push(stop); return stop; }
function clearRun(){ RUN.timers.forEach(id=>{ clearTimeout(id); clearInterval(id); }); RUN.rafs.forEach(id=>cancelAnimationFrame(id)); RUN.stops.forEach(f=>{ try{ f(); }catch(e){} }); RUN.timers=[]; RUN.rafs=[]; RUN.stops=[]; }

/* ---------- full-screen layer and bottom sheet ---------- */
let FULL_ON_CLOSE=null;
function openFull(html, cls, onClose){ clearRun(); const f=$('#full'); f.className='full'+(cls?' '+cls:''); $('#fullIn').innerHTML=html; f.hidden=false; FULL_ON_CLOSE=onClose||null; birdPause(true); const x=$('#fullIn [data-close]'); if(x) x.addEventListener('click',()=>closeFull()); }
function closeFull(){ clearRun(); const f=$('#full'); f.hidden=true; $('#fullIn').innerHTML=''; birdPause(false); const cb=FULL_ON_CLOSE; FULL_ON_CLOSE=null; if(cb) cb(); renderAll(); }
function openSheet(html){ const w=$('#sheetwrap'); $('#sheet').innerHTML=html; w.hidden=false; const x=$('#sheet [data-close]'); if(x) x.addEventListener('click',closeSheet); const f=$('#sheet button, #sheet input'); if(f) try{ f.focus({preventScroll:true}); }catch(e){} }
function closeSheet(){ $('#sheetwrap').hidden=true; $('#sheet').innerHTML=''; }
$('#sheetwrap').addEventListener('click',e=>{ if(e.target.id==='sheetwrap') closeSheet(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(!$('#sheetwrap').hidden) closeSheet(); else if(!$('#full').hidden && !$('#full').classList.contains('welcome')) closeFull(); } });
const XBTN='<button class="x" data-close aria-label="Close">×</button>';

/* ---------- the manu, drawn as in Manu Ora ---------- */
function shade(hex,f){ const n=parseInt(hex.slice(1),16); let r=n>>16,g=(n>>8)&255,b=n&255; r=Math.round(r*f);g=Math.round(g*f);b=Math.round(b*f); return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join(''); }
function lum(hex){ const n=parseInt(hex.slice(1),16); return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255; }
const LOOK={g:4,s:1,hs:1,er:4.2,wl:20,tl:1.2,crest:2,dx:0,dy:0};
function wingSVG(body){ const wl=LOOK.wl, F=wl*1.5; const px=44+wl*.8, py=66-wl*.5; const dark=shade(body,.78), mid=shade(body,.9), edge=shade(body,.58);
  const fe=(len,w,ang,pt,base)=>{ const tx=-len*(1.03-pt*.22), ty=w*(1.08-pt*.55);
    const d=`M0 ${(-w*.45).toFixed(1)} C${(-len*.3).toFixed(1)} ${(-w).toFixed(1)} ${tx.toFixed(1)} ${(-ty).toFixed(1)} ${(-len).toFixed(1)} 0 C${tx.toFixed(1)} ${ty.toFixed(1)} ${(-len*.3).toFixed(1)} ${w.toFixed(1)} 0 ${(w*.45).toFixed(1)}Z`;
    return `<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${(180-ang).toFixed(1)})"><path d="${d}" fill="${base}" stroke="${edge}" stroke-width=".55" stroke-linejoin="round"/><path d="M${(-len*.18).toFixed(1)} 0 H${(-len*.86).toFixed(1)}" stroke="#fff" stroke-width=".6" stroke-linecap="round" opacity=".38"/></g>`; };
  let h=''; for(let j=6;j>=0;j--) h+=fe(F*(.8+j*.07), wl*.27, 176+j*6, j/6, j%2?dark:mid);
  for(let j=6;j>=0;j--) h+=fe(F*(.46+j*.025), wl*.26, 173+j*6.5, 0, j%2?mid:dark);
  h+=`<ellipse cx="${(px-wl*.12).toFixed(1)}" cy="${(py+wl*.1).toFixed(1)}" rx="${(wl*.46).toFixed(1)}" ry="${(wl*.36).toFixed(1)}" transform="rotate(28 ${px.toFixed(1)} ${py.toFixed(1)})" fill="${mid}" stroke="${edge}" stroke-width=".5"/>`;
  return h; }
function accParts(c){ const a=c.acc||{};
  const hei = a.hei ? ['#FFF4C2','#F28CB1','#F0A23A','#FFF4C2','#F28CB1','#F0A23A','#FFF4C2'].map((col,i)=>{ const t=(200+i*24)*Math.PI/180; return `<circle cx="${(82+18*Math.cos(t)).toFixed(1)}" cy="${(46+18*Math.sin(t)).toFixed(1)}" r="3.4" fill="${col}" stroke="#3B8C58" stroke-width=".8"/>`; }).join('') : '';
  const pet=(r,fill,stroke)=>[0,72,144,216,288].map(t=>`<circle cx="${(4.6*Math.cos(t*Math.PI/180)).toFixed(1)}" cy="${(4.6*Math.sin(t*Math.PI/180)).toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width=".6"/>`).join('');
  const flower = a.tiare && !a.hei ? `<g transform="translate(66 36)">${pet(3.6,'#FFF9EE','#E8D9B5')}<circle r="2.2" fill="#F2C94C"/></g>` : '';
  const titia = a.titia ? `<g><line x1="83" y1="40" x2="66" y2="38" stroke="#10202A" stroke-width="2" stroke-linecap="round"/><rect x="82" y="37" width="15" height="9.5" rx="3.6" fill="#10202A"/><line x1="85" y1="39.6" x2="90" y2="39.6" stroke="#fff" stroke-width="1" opacity=".55" stroke-linecap="round"/></g>` : '';
  return {top:hei+flower, eyes:titia}; }
function birdSVG(c,id){
  const L=LOOK, wing=shade(c.body,.78), A=accParts(c);
  const pareu = c.acc && c.acc.pareu ? `<rect x="18" y="74" width="72" height="30" fill="url(#${id}-pareu)" clip-path="url(#${id}-clip)"/><path d="M26 74 L84 74" stroke="#FFF6E3" stroke-width="2"/>` : '';
  return `<svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><pattern id="${id}-pareu" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#1AA3B1"/><circle cx="4" cy="4" r="1.6" fill="#FFF6E3"/></pattern><clipPath id="${id}-clip"><ellipse cx="55" cy="68" rx="30" ry="24"/></clipPath></defs>
    <g class="tail"><g transform="translate(30 71) scale(${L.tl} 1) translate(-30 -71)"><polygon points="30,69 -4,66 -2,71 -4,76 30,73" fill="${wing}"/><polygon points="30,66 4,56 10,74 4,86 30,76" fill="${wing}"/><polygon points="30,70 12,66 14,80 30,76" fill="${c.body}"/></g></g>
    <g class="legs"><g class="leg l1"><line x1="48" y1="88" x2="46" y2="103" stroke="#F0A23A" stroke-width="3" stroke-linecap="round"/><polyline points="38,104 46,103 54,105" fill="none" stroke="#F0A23A" stroke-width="3" stroke-linecap="round"/></g><g class="leg l2"><line x1="58" y1="88" x2="60" y2="103" stroke="#D98B2B" stroke-width="3" stroke-linecap="round"/><polyline points="52,104 60,103 68,105" fill="none" stroke="#D98B2B" stroke-width="3" stroke-linecap="round"/></g></g>
    <g class="body"><ellipse cx="55" cy="68" rx="30" ry="24" fill="${c.body}"/><ellipse cx="60" cy="74" rx="18" ry="14" fill="${c.belly}"/>${pareu}</g>
    <g class="wing">${wingSVG(c.body)}</g>
    <g class="head">${(!(c.acc&&c.acc.hei))?[[76,31,69,16,80,27],[80,30,77,12,86,26]].map((q,i)=>`<polygon points="${q[0]},${q[1]} ${q[2]},${q[3]} ${q[4]},${q[5]}" fill="${i%2?wing:c.body}" stroke="${wing}" stroke-width=".6"/>`).join(''):''}<circle cx="82" cy="46" r="18" fill="${c.body}"/><circle cx="84" cy="52" r="9" fill="${c.belly}" opacity=".9"/><polygon points="98,45 114,50 98,55" fill="#F0A23A"/><circle cx="92" cy="50" r="3.6" fill="#F28CB1" opacity=".6"/><g class="eye"><circle cx="89" cy="42" r="${L.er}" fill="#10303B"/><circle cx="${(89+L.er*.36).toFixed(1)}" cy="${(42-L.er*.36).toFixed(1)}" r="${(L.er*.33).toFixed(1)}" fill="#fff"/></g>${A.top}${A.eyes}</g>
  </svg>`; }

/* ---------- the manu walks the beach of the current island ---------- */
const birdEl=$('#bird'), flipEl=$('#birdFlip'), bubbleEl=$('#bubble'), stageEl=$('#stage');
const BW=84, BH=77;
const B={x:80,y:0,dir:1,state:'idle',t:1.2,to:null,from:null,p:0,dur:1,paused:false,onArrive:null};
function geom(){ const W=stageEl.clientWidth, H=stageEl.clientHeight, s=Math.max(W/360,H/640); return {W,H,s,vx:x=>(x-180)*s+W/2, vy:y=>H-(640-y)*s}; }
function groundY(){ const g=geom(), I=ISL[S.island]; return g.vy(I.ground)-BH*.95; }
function walkRange(){ const g=geom(), I=ISL[S.island]; return [Math.max(4,g.vx(I.walk[0])), Math.min(g.W-BW-4,g.vx(I.walk[1])-BW)]; }
function renderBird(){ flipEl.innerHTML=birdSVG(S,'live'); $('#logo').innerHTML=logoSVG(); }
function place(){ birdEl.style.transform=`translate(${B.x}px,${B.y}px)`; flipEl.style.transform=`scaleX(${B.dir})`; placeBubble(); }
function setState(s){ B.state=s; birdEl.classList.toggle('walking',s==='walk'); birdEl.classList.toggle('flying',s==='fly'); birdEl.classList.toggle('petted',s==='pet'); }
function idle(sec){ setState('idle'); B.t=sec||rnd(2,5); }
function startWalk(){ const [a,b]=walkRange(); B.to={x:rnd(a,b),y:groundY()}; B.dir=B.to.x>B.x?1:-1; setState('walk'); }
function startFly(target,cb){ B.from={x:B.x,y:B.y}; B.to=target; B.dir=target.x>B.x?1:-1; B.p=0; B.dur=Math.max(.9,Math.hypot(target.x-B.x,target.y-B.y)/260); B.onArrive=cb||null; setState('fly'); }
function nextMove(){ if(RM){ idle(8); return; } const r=Math.random(); if(r<.55) startWalk(); else if(r<.75){ birdEl.classList.add('pecking'); setTimeout(()=>birdEl.classList.remove('pecking'),1100); idle(2.4); } else if(r<.85){ const [a,b]=walkRange(); startFly({x:rnd(a,b),y:groundY()}); } else idle(3); }
let lastT=0;
function loop(ts){ const dt=Math.min(.05,(ts-lastT)/1000||0); lastT=ts;
  if(!B.paused){
    if(B.state==='idle'){ B.t-=dt; if(B.t<=0) nextMove(); B.y=groundY(); }
    else if(B.state==='walk'){ const dx=B.to.x-B.x; if(Math.abs(dx)<2){ B.x=B.to.x; idle(); } else B.x+=Math.sign(dx)*58*dt; B.y=groundY(); }
    else if(B.state==='fly'){ B.p=Math.min(1,B.p+dt/B.dur); const t=B.p, e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; const cx=(B.from.x+B.to.x)/2, cy=Math.min(B.from.y,B.to.y)-120; B.x=(1-e)*(1-e)*B.from.x+2*(1-e)*e*cx+e*e*B.to.x; B.y=(1-e)*(1-e)*B.from.y+2*(1-e)*e*cy+e*e*B.to.y; if(B.p>=1){ idle(1.5); const f=B.onArrive; B.onArrive=null; if(f) f(); } }
    place();
  }
  requestAnimationFrame(loop); }
function birdPause(on){ B.paused=on; }
function placeBubble(){ if(!bubbleEl.classList.contains('show')) return; const W=stageEl.clientWidth; const bw=bubbleEl.offsetWidth, bh=bubbleEl.offsetHeight; let x=B.x+BW/2-bw/2; x=clamp(x,8,W-bw-8); let y=B.y-bh-8; if(y<6) y=B.y+BH+8; bubbleEl.style.transform=`translate(${x}px,${y}px)`; }
function bubble(reo,en,ms){ bubbleEl.innerHTML=(reo?`<b>${esc(reo)}</b>`:'')+esc(en||''); bubbleEl.classList.add('show'); placeBubble(); clearTimeout(bubble.t); bubble.t=setTimeout(()=>bubbleEl.classList.remove('show'),ms||4200); }

function actManta(el,done){
  injectCSS('manta',`@keyframes mwL{from{transform:rotate(-6deg)}to{transform:rotate(8deg)}}@keyframes mwR{from{transform:rotate(6deg)}to{transform:rotate(-8deg)}}.mwl{transform-box:view-box;transform-origin:0 0;animation:mwL 1.6s ease-in-out infinite alternate}.mwr{transform-box:view-box;transform-origin:0 0;animation:mwR 1.6s ease-in-out infinite alternate}`);
  el.innerHTML=`<div class="art"><svg viewBox="0 0 360 360" aria-label="A manta ray in deep blue water"><defs>${vgrad('mnW','#2A86B0','#08304D',0,360)}</defs><rect width="360" height="360" fill="url(#mnW)"/>${[60,170,280].map((x,i)=>`<polygon points="${x},0 ${x+26},0 ${x-14},360 ${x-60},360" fill="#fff" opacity=".07"/>`).join('')}<path d="M110 360 Q130 300 180 296 Q232 300 250 360Z" fill="#6E8B7A"/><circle cx="160" cy="306" r="10" fill="#E58A9B"/><circle cx="206" cy="310" r="12" fill="#B98AD6"/><ellipse id="mnGoal" cx="180" cy="186" rx="120" ry="58" fill="none" stroke="#FFD08A" stroke-width="2" stroke-dasharray="6 6" opacity=".55"/><g id="mnM"><path d="M0 30 Q2 50 -2 74" stroke="#1A2832" stroke-width="2.4" fill="none"/><g class="mwl"><path d="M0 -20 Q-34 -22 -104 6 Q-56 12 -20 28 Q-8 36 0 32Z" fill="#1F2E3A"/><path d="M-30 -10 Q-46 0 -30 10 Q-22 2 -30 -10Z" fill="#DDE7EC" opacity=".85"/></g><g class="mwr"><path d="M0 -20 Q34 -22 104 6 Q56 12 20 28 Q8 36 0 32Z" fill="#1F2E3A"/><path d="M30 -10 Q46 0 30 10 Q22 2 30 -10Z" fill="#DDE7EC" opacity=".85"/></g><path d="M-12 -18 q-8 -6 -6 -16 q6 4 10 14Z M12 -18 q8 -6 6 -16 q-6 4 -10 14Z" fill="#1F2E3A"/><path d="M-60 6 Q0 -4 60 6" stroke="#3A5262" stroke-width="1.4" fill="none" opacity=".7"/></g><g id="mnBub"></g></svg></div>
    <div class="card"><p class="small">Hold <b>Swim gently</b> to move closer. Too fast and the <span class="reo">fāfā piti</span> will leave. Stop at the dotted ring and stay still.</p><div class="meter" aria-hidden="true"><div class="z" style="left:0;width:72%"></div><div class="f" id="mnS" style="opacity:.8"></div></div><span class="fb" id="mnFb" aria-live="polite">Calm and slow.</span></div>
    <button class="btn primary" id="mnGo" style="min-height:72px;font-size:1.15rem;touch-action:none;user-select:none;-webkit-user-select:none">Swim gently</button>`;
  const M=$('#mnM'), sEl=$('#mnS'), fb=$('#mnFb'), go=$('#mnGo'); let d=1, spd=0, hold=false, still=0, phase='swim', t=0, out=0;
  const on=e=>{ e.preventDefault(); hold=true; go.classList.add('held'); }, off=()=>{ hold=false; go.classList.remove('held'); };
  go.addEventListener('pointerdown',on); go.addEventListener('pointerup',off); go.addEventListener('pointerleave',off); go.addEventListener('pointercancel',off);
  const kd=e=>{ if(e.key===' '){ e.preventDefault(); hold=true; } }, ku=e=>{ if(e.key===' ') hold=false; }; document.addEventListener('keydown',kd); document.addEventListener('keyup',ku); RUN.stops.push(()=>{ document.removeEventListener('keydown',kd); document.removeEventListener('keyup',ku); });
  const bubbles=()=>{ const b=$('#mnBub'); b.innerHTML=Array.from({length:10},()=>`<circle cx="${rnd(120,240)}" cy="${rnd(240,330)}" r="${rnd(2,6)}" fill="none" stroke="#fff" opacity=".6"/>`).join(''); later(()=>{ b.innerHTML=''; },700); };
  frames(dt=>{ t+=dt;
    if(phase==='swim'){ spd=clamp(spd+(hold?.5:-.9)*dt,0,1); d=Math.max(.3,d-spd*.17*dt);
      if(spd>.72){ spd=0; d=Math.min(1,d+.3); sfx('splash'); bubbles(); fb.className='fb bad'; fb.textContent='Too fast! The manta glided away. Slow down.'; }
      else if(hold){ fb.className='fb'; fb.textContent='Gently…'; }
      if(d<=.3){ phase='wait'; fb.className='fb good'; fb.textContent='Perfect distance. Let go and stay still…'; } }
    else if(phase==='wait'){ spd=clamp(spd-.9*dt,0,1); if(hold){ still=0; fb.className='fb'; fb.textContent='Stay still… let it come to you.'; } else { still+=dt; if(still>3){ phase='pass'; fb.className='fb good'; fb.textContent='Fāfā piti! It glides right over you.'; sayWord('fafapiti'); } } }
    else if(phase==='pass'){ out+=dt; if(out>2.6){ later(()=>done('You watched a manta from a respectful distance.'),200); return false; } }
    sEl.style.width=(spd*100)+'%';
    const sc= phase==='pass' ? 1.2+out*.9 : .32+(1-d)*.85, y= phase==='pass' ? 186-out*90 : 200-(1-d)*18+Math.sin(t*1.2)*6, x=180+Math.sin(t*.5)*(phase==='pass'?0:30*d);
    M.setAttribute('transform',`translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${sc.toFixed(3)})`); M.setAttribute('opacity',phase==='pass'?Math.max(0,1-out/2.6).toFixed(2):'1'); }); }

/* --- Te mau fetiʻa: stars over Matira --- */
function actStars(el,done){
  const rand=seeded(42); let bg=''; for(let i=0;i<150;i++) bg+=`<circle cx="${(rand()*360).toFixed(1)}" cy="${(rand()*330).toFixed(1)}" r="${(.4+rand()*1).toFixed(2)}" fill="#FFF6E3" opacity="${(.25+rand()*.5).toFixed(2)}"/>`;
  const hook=[[92,256],[100,272],[110,290],[116,306],[126,322],[140,332],[156,336],[168,328],[170,314]];
  const T=[
    {w:'matarii', x:80, y:110, q:'Find <b>Matariʻi</b>, “the little eyes”: a tight little cluster of stars.', draw:[[-6,-4,2],[0,-7,2.4],[6,-2,2],[-3,2,2.2],[4,4,2.6],[10,5,1.8],[0,9,1.8]].map(p=>`<circle cx="${80+p[0]}" cy="${110+p[1]}" r="${p[2]}" fill="#EAF2FF"/>`).join('')},
    {w:'tautoru', x:186, y:186, q:'Find <b>Tautoru</b>, “the three”: three stars in a neat row.', draw:[[170,180],[186,186],[202,192]].map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="2.8" fill="#F4F7FF"/>`).join(''), lines:'M170 180 L202 192'},
    {w:'taurua', x:286, y:250, q:'Find <b>Taʻurua-faupapa</b>: the brightest star of the night.', draw:'<circle cx="286" cy="250" r="12" fill="#BFD8FF" opacity=".18"/><circle cx="286" cy="250" r="4.6" fill="#E6F0FF"/>'},
    {w:'anamua', x:110, y:290, q:'Find <b>ʻAna-mua</b>: the red heart of Te Matau a Māui, the fishhook of Māui.', draw:hook.map((p,i)=>i===2?'':`<circle cx="${p[0]}" cy="${p[1]}" r="2" fill="#F4F7FF" opacity=".8"/>`).join('')+'<circle cx="110" cy="290" r="10" fill="#FF7A5C" opacity=".18"/><circle cx="110" cy="290" r="4" fill="#FF8A6A"/>', lines:'M'+hook.map(p=>p.join(' ')).join(' L')}
  ];
  let round=0, miss=0;
  el.innerHTML=`<div class="art" id="stArt"><svg viewBox="0 0 360 420" aria-label="The night sky over Matira beach"><defs>${vgrad('stS','#050D24','#22406A',0,360)}</defs><rect width="360" height="420" fill="url(#stS)" id="stSky"/>${bg}${T.map(o=>o.draw).join('')}<g id="stLines" stroke="#FFD08A" stroke-width="1.4" fill="none" opacity=".9"></g><g id="stLab"></g><g id="stHint"></g><rect y="360" width="360" height="60" fill="#0A1E33"/><path d="M0 372 Q180 364 360 372 V420 H0Z" fill="#14324A"/><path d="M0 396 Q120 384 230 392 T360 388 V420 H0Z" fill="#E9DDB8" opacity=".25"/><g transform="translate(320 420) scale(-.8 .8)" opacity=".9"><path d="M-6 0 Q-12 -70 22 -140 L30 -137 Q2 -70 7 0Z" fill="#06121F"/><g transform="translate(26 -140)">${[-150,-115,-75,-35,5].map(a=>`<path d="M0 0 Q28 -22 62 4 Q30 -6 0 0Z" transform="rotate(${a})" fill="#06121F"/>`).join('')}</g></g></svg></div>
    <div class="card"><p id="stQ"></p><div class="row" style="justify-content:space-between"><span class="fb" id="stFb" aria-live="polite"></span><span class="prog" id="stProg">${prog(0,4)}</span></div><p class="small muted">These stars are not all up on the same night of the year. They are gathered here so you can learn them.</p></div>`;
  const svg=$('#stArt svg'), fb=$('#stFb');
  const ask=()=>{ $('#stQ').innerHTML=T[round].q; miss=0; $('#stHint').innerHTML=''; };
  ask();
  svg.addEventListener('pointerdown',e=>{ if(round>=4) return; const r=svg.getBoundingClientRect(); const x=(e.clientX-r.left)/r.width*360, y=(e.clientY-r.top)/r.height*420; const o=T[round];
    if(Math.hypot(x-o.x,y-o.y)<34){ sfx('good'); sayWord(o.w); fb.className='fb good'; fb.textContent=`${W[o.w].r} · ${W[o.w].en}`;
      $('#stLab').insertAdjacentHTML('beforeend',`<text x="${o.x}" y="${o.y-20}" text-anchor="middle" font-family="Fredoka,Nunito,sans-serif" font-weight="600" font-size="13" fill="#FFE7B8">${W[o.w].r}</text>`);
      if(o.lines) $('#stLines').insertAdjacentHTML('beforeend',`<path d="${o.lines}"/>`); $('#stHint').innerHTML='';
      round++; $('#stProg').innerHTML=prog(round,4); if(round>=4) later(()=>done('You can read four guide stars of the Polynesian sky.'),1500); else later(ask,1300); }
    else { miss++; sfx('bad'); fb.className='fb bad'; fb.textContent=miss>=2?'Look where the circle glows.':'Not that one. Look again.'; if(miss>=2) $('#stHint').innerHTML=`<circle cx="${o.x}" cy="${o.y}" r="26" fill="none" stroke="#FFD08A" stroke-width="2" class="sc-twinkle"/>`; } }); }

/* ---------- main screen ---------- */
function renderScene(){ const sc=$('#scene'); if(sc.dataset.i!==S.island){ sc.innerHTML=ISL[S.island].scene(); sc.dataset.i=S.island; } }
function renderPins(){ const I=ISL[S.island], g=geom(), box=$('#pins');
  box.innerHTML=I.acts.map(id=>{ const A=ACTS[id]; return `<button class="pin${S.done[id]?' done':''}" data-a="${id}" aria-label="${A.en}${S.done[id]?', done':''}"><span class="ic"><svg viewBox="0 0 24 24">${S.done[id]?'<path d="M5 12.5l4.5 4.5L19 7.5"/>':ICON[A.icon]}</svg></span><span>${A.r}<small>${A.en}</small></span></button>`; }).join('');
  $$('.pin',box).forEach(b=>{ const A=ACTS[b.dataset.a]; const w=b.offsetWidth, h=b.offsetHeight; const x=clamp(g.vx(A.at[0]),w/2+8,g.W-w/2-8), y=clamp(g.vy(A.at[1]),h/2+8,g.H-h/2-8); b.style.left=x+'px'; b.style.top=y+'px'; b.onclick=()=>openAct(b.dataset.a); }); }
function renderHeader(){ const I=ISL[S.island], n=I.acts.filter(a=>S.done[a]).length; $('#islLabel').innerHTML=`<b>${I.r}</b>${I.r!==I.en?' · '+I.en:''} · ${n}/3`;
  $('#soundBtn').innerHTML=S.sound?'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4Z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>':'<svg viewBox="0 0 24 24"><path d="M4 9.5h3.5L12 6v12l-4.5-3.5H4Z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>';
  $('#soundBtn').setAttribute('aria-label',S.sound?'Sound on. Tap to mute':'Sound off. Tap to turn on'); birdEl.setAttribute('aria-label',`${S.name}, your manu. Tap to hear a word.`); }
function renderAll(){ renderScene(); renderHeader(); renderBird(); renderPins(); }

/* ---------- sheets ---------- */
function openInfo(){ const I=ISL[S.island];
  const legs=ISL_ORDER.filter(i=>i!==S.island).map(i=>{ const L=LEG[S.island+'>'+i]; return `<li>To ${ISL[i].en}: ${L.today}.</li>`; }).join('');
  openSheet(`<div class="shead"><div><div class="eyebrow">Visit for real · ${I.tag}</div><h2><span class="reo">${I.r}</span>${I.r!==I.en?' · '+I.en:''}</h2></div>${XBTN}</div>
    <ul class="facts small">${I.facts.map(f=>`<li>${f}</li>`).join('')}</ul>
    <div class="card flat"><div class="eyebrow">Don’t miss</div><ul class="facts small">${I.go.map(f=>`<li>${f}</li>`).join('')}</ul></div>
    <div class="card flat"><div class="eyebrow">Getting around</div><ul class="facts small">${legs}</ul></div>
    <div class="card" style="border-left:0"><div class="eyebrow">With respect</div><p class="small">${I.respect}</p></div>
    <p class="small muted">Manu Tere is a prototype. Travel times are approximate, and the Reo Māʻohi words and their pronunciation still need checking by native speakers.</p>`); }
function openWords(){ const known=S.words.filter(w=>W[w]); const total=Object.keys(W).length;
  const groups=WGROUPS.map(([g,label])=>{ const ws=known.filter(w=>W[w].g===g); if(!ws.length) return ''; return `<div class="stack" style="gap:0"><div class="eyebrow" style="margin-top:6px">${label}</div><div class="wlist">${ws.map(w=>`<div class="wrow"><b>${W[w].r}</b>${spkBtn(w)}<span class="en">${W[w].en}</span><span class="ph">say: ${W[w].ph}</span></div>`).join('')}</div></div>`; }).join('');
  openSheet(`<div class="shead"><div><div class="eyebrow">Parau · Words</div><h2>${known.length} of ${total} words</h2></div>${XBTN}</div>
    <div class="card flat"><p class="small"><b>How to say it.</b> Vowels are pure: <i>a</i> as in father, <i>e</i> as in bed, <i>i</i> as in machine, <i>o</i> as in more, <i>u</i> as in moon. The <span class="reo">ʻ</span> (ʻeta) is a short catch in the voice, as in “uh-oh”. A line over a vowel (ā) makes it longer.</p><p class="small muted">The voice is a computer approximation until native speakers record the words.</p></div>
    ${groups||'<p class="muted">Tap your manu or try an activity to learn your first words.</p>'}
    ${known.length<total?`<p class="small muted">${total-known.length} more words to find on your voyage.</p>`:''}`); }
function openPassport(){ const nW=S.words.length;
  openSheet(`<div class="shead"><div><div class="eyebrow">Passport</div><h2>Te Fenua Māʻohi</h2></div>${XBTN}</div>
    <div class="pstamps">${ISL_ORDER.map(id=>{ const I=ISL[id]; return `<div class="pst">${stampSVG(id,S.visited.includes(id))}<div class="acts" aria-label="${I.acts.filter(a=>S.done[a]).length} of 3 activities">${I.acts.map(a=>`<i class="${S.done[a]?'on':''}" title="${ACTS[a].en}"></i>`).join('')}</div><span class="small">${I.en}</span></div>`; }).join('')}</div>

    <div class="stack"><div class="eyebrow">Still to visit</div><div class="soon">${SOON.map(s=>`<div class="card flat"><b>${s[0]}</b><span class="small muted">Coming soon</span></div>`).join('')}</div></div>`); }
const COLORS=[['#E4583F','ʻUra (red)'],['#2F7FD8','Blue'],['#1AA3B1','Lagoon'],['#3B8C58','Green'],['#E9B93A','Gold'],['#8A5BC4','Violet'],['#1F2F4A','Night']];
const ACC=[['tiare','Tiare','A flower behind the ear',()=>true],['hei','Hei','Finish Tahiti',()=>ISL.tahiti.acts.every(a=>S.done[a])],['pareu','Pāreu','Finish Moʻorea',()=>ISL.moorea.acts.every(a=>S.done[a])],['titia','Sunglasses','Finish Porapora',()=>ISL.bora.acts.every(a=>S.done[a])]];
function openManu(confirmReset){
  openSheet(`<div class="shead"><div><div class="eyebrow">My manu</div><h2>${esc(S.name)}</h2></div>${XBTN}</div>
    <div class="birdbox" id="pv">${birdSVG(S,'pv')}</div>
    <label class="small" for="nmIn"><b>Name</b></label><input type="text" id="nmIn" maxlength="16" value="${esc(S.name)}">
    <div class="stack"><b class="small">Feathers</b><div class="swatches">${COLORS.map(c=>`<button class="sw ${S.body===c[0]?'on':''}" data-c="${c[0]}" style="background:${c[0]}" aria-label="${c[1]}"></button>`).join('')}</div></div>
    <div class="stack"><b class="small">Wear</b><div class="toggles">${ACC.map(a=>{ const ok=a[3](); return `<button class="tg ${S.acc[a[0]]&&ok?'on':''}" data-a="${a[0]}" ${ok?'':'disabled'} aria-pressed="${!!(S.acc[a[0]]&&ok)}"><b>${a[1]}</b><span>${ok?(S.acc[a[0]]?'Wearing':'Tap to wear'):'Locked · '+a[2]}</span></button>`; }).join('')}</div></div>
    <div class="row"><button class="btn ghost sm" id="snd">${S.sound?'Turn sound off':'Turn sound on'}</button><button class="btn ghost sm" id="rst">Start over</button></div>
    ${confirmReset?'<div class="card flat"><p class="small">This erases your stamps, words and manu on this phone.</p><div class="row"><button class="btn sun sm" id="rstYes">Erase and start over</button><button class="btn ghost sm" id="rstNo">Keep my voyage</button></div></div>':''}`);
  const upd=()=>{ save(); $('#pv').innerHTML=birdSVG(S,'pv'); renderBird(); renderHeader(); };
  $('#nmIn').addEventListener('input',e=>{ S.name=e.target.value.trim()||'Tere'; save(); renderHeader(); });
  $$('#sheet .sw').forEach(b=>b.onclick=()=>{ S.body=b.dataset.c; $$('#sheet .sw').forEach(x=>x.classList.toggle('on',x===b)); upd(); sfx('tap'); });
  $$('#sheet .tg').forEach(b=>b.onclick=()=>{ const k=b.dataset.a; S.acc[k]=!S.acc[k]; b.classList.toggle('on',S.acc[k]); b.setAttribute('aria-pressed',S.acc[k]); b.querySelector('span').textContent=S.acc[k]?'Wearing':'Tap to wear'; upd(); sfx('tap'); });
  $('#snd').onclick=()=>{ S.sound=!S.sound; save(); renderHeader(); openManu(); };
  $('#rst').onclick=()=>openManu(true);
  if(confirmReset){ $('#rstYes').onclick=()=>{ S=JSON.parse(JSON.stringify(DEF)); save(); closeSheet(); $('#scene').dataset.i=''; renderAll(); openWelcome(); }; $('#rstNo').onclick=()=>openManu(); } }

function openWelcome(){

      <label class="small" for="wName"><b>Give me a name</b></label><input type="text" id="wName" maxlength="16" value="${esc(S.name)}">
      <div class="swatches" role="group" aria-label="Feather colour">${COLORS.map(c=>`<button class="sw ${S.body===c[0]?'on':''}" data-c="${c[0]}" style="background:${c[0]}" aria-label="${c[1]}"></button>`).join('')}</div>
      <button class="btn sun" id="wGo">Fly to Tahiti</button></div></div>`,'welcome');
  $$('#fullIn .sw').forEach(b=>b.onclick=()=>{ S.body=b.dataset.c; $$('#fullIn .sw').forEach(x=>x.classList.toggle('on',x===b)); $('#wBird').innerHTML=birdSVG(S,'wb'); $('#fullIn .wplane').innerHTML=planeSVG('wp'); renderBird(); });
  $('#wGo').onclick=()=>{ ac(); S.name=($('#wName').value||'').trim()||'Tere'; S.onboarded=true; S.island='tahiti'; if(!S.visited.includes('tahiti')) S.visited.push('tahiti'); learn(['iaorana','maeva','manu','tere'],true); save(); flyIn(()=>{ closeFull(); sfx('stamp'); landBird(); later(()=>toast('Stamp: <b>Tahiti</b>. Tap the pins to explore, or tap your manu.'),900); }); }; }

/* ---------- start ---------- */
$('#dMap').onclick=()=>{ ac(); MAPSEL=null; openMap(); };
$('#dWords').onclick=()=>{ ac(); openWords(); };
$('#dPass').onclick=()=>{ ac(); openPassport(); };
$('#dManu').onclick=()=>{ ac(); openManu(); };
$('#infoBtn').onclick=openInfo;
$('#soundBtn').onclick=()=>{ S.sound=!S.sound; save(); renderHeader(); if(S.sound){ ac(); sfx('tap'); } else { try{ speechSynthesis.cancel(); }catch(e){} } };
renderAll();
B.y=groundY(); { const [a,b]=walkRange(); B.x=(a+b)/2; } place();
requestAnimationFrame(loop);
let rT=null; window.addEventListener('resize',()=>{ clearTimeout(rT); rT=setTimeout(()=>{ renderPins(); const [a,b]=walkRange(); B.x=clamp(B.x,a,b); if(B.state!=='fly') B.y=groundY(); },120); });
if(location.hash==='#dev') window.MT={state:()=>S, openAct, finishAct, startVoyage, openMap, openWords, openPassport, openManu, openInfo, closeFull, island:i=>{ S.island=i; if(!S.visited.includes(i)) S.visited.push(i); save(); closeFull(); renderAll(); }};
if(!S.onboarded) openWelcome();
else later(()=>bubble(W.iaorana.r+'!','Welcome back to '+ISL[S.island].en+'.'),900);

})();
</script>
</body>
